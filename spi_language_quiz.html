<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPI 言語ドリル</title>
<style>
  :root{
    --bg:#eef1f4;
    --panel:#ffffff;
    --ink:#1b2733;
    --ink-weak:#5c6b7a;
    --line:#d5dce3;
    --indigo:#27456f;
    --indigo-soft:#e7edf5;
    --correct:#186b52;
    --correct-soft:#e4f1ec;
    --wrong:#a83428;
    --wrong-soft:#f8e8e6;
    --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Times New Roman",serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--gothic);
    font-size:16px;
    line-height:1.7;
    -webkit-text-size-adjust:100%;
    padding:0 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}

  header.site{
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding-bottom:14px;margin-bottom:18px;border-bottom:2px solid var(--indigo);
  }
  header.site h1{
    font-family:var(--mincho);
    font-size:22px;font-weight:600;letter-spacing:.06em;margin:0;
  }
  header.site .sub{font-size:13px;color:var(--ink-weak)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
  .card + .card{margin-top:14px}

  /* ---- ホーム ---- */
  .modes{display:grid;gap:12px}
  @media(min-width:560px){.modes{grid-template-columns:1fr 1fr}}
  .mode{
    text-align:left;width:100%;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:18px;font:inherit;color:inherit;
    border-left:5px solid var(--indigo);
  }
  .mode:hover{background:var(--indigo-soft)}
  .mode:disabled{opacity:.5;cursor:not-allowed}
  .mode:disabled:hover{background:var(--panel)}
  .mode b{display:block;font-family:var(--mincho);font-size:18px;font-weight:600;margin-bottom:4px}
  .mode span{font-size:13px;color:var(--ink-weak);line-height:1.6}

  .stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--ink-weak)}
  .stats b{display:block;font-family:var(--mincho);font-size:26px;color:var(--ink);line-height:1.2}

  /* ---- 出題 ---- */
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--ink-weak)}
  .bar .count{font-variant-numeric:tabular-nums}
  .instruction{
    background:#e8ebef;border-radius:4px;padding:11px 13px;
    font-size:13.5px;line-height:1.65;margin-bottom:16px;
  }
  .passage{
    font-family:var(--mincho);font-size:15px;line-height:1.95;
    border:1px solid var(--line);border-radius:4px;padding:14px;
    margin-bottom:16px;background:#fbfcfd;
  }
  .passage .source{display:block;margin-top:10px;font-size:12.5px;color:var(--ink-weak)}
  .stem{
    font-family:var(--mincho);font-size:19px;line-height:1.8;
    border-left:4px solid var(--wrong);padding-left:12px;margin:0 0 18px;
  }
  .stem u{text-underline-offset:3px}

  .options{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .opt{
    display:flex;gap:11px;align-items:flex-start;
    border:1px solid var(--line);border-radius:5px;background:#fff;
    padding:12px 13px;cursor:pointer;font:inherit;text-align:left;width:100%;color:inherit;
    line-height:1.6;
  }
  .opt:hover{border-color:var(--indigo)}
  .opt .k{
    flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--ink-weak);font-variant-numeric:tabular-nums;
  }
  .opt.multi .k{border-radius:5px}
  .opt.picked{border-color:var(--indigo);background:var(--indigo-soft)}
  .opt.picked .k{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .opt.is-correct{border-color:var(--correct);background:var(--correct-soft)}
  .opt.is-correct .k{background:var(--correct);border-color:var(--correct);color:#fff}
  .opt.is-wrong{border-color:var(--wrong);background:var(--wrong-soft)}
  .opt.is-wrong .k{background:var(--wrong);border-color:var(--wrong);color:#fff}
  .opt[disabled]{cursor:default}

  input[type=text]{
    width:100%;padding:12px 13px;font:inherit;font-family:var(--mincho);font-size:18px;
    border:1px solid var(--line);border-radius:5px;background:#fff;color:inherit;
  }
  input[type=text]:focus{outline:2px solid var(--indigo);outline-offset:1px}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .btn{
    font:inherit;cursor:pointer;border-radius:5px;padding:12px 20px;border:1px solid var(--indigo);
    background:var(--indigo);color:#fff;flex:1 1 auto;min-width:140px;
  }
  .btn.ghost{background:transparent;color:var(--indigo)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.small{flex:0 0 auto;min-width:0;padding:8px 14px;font-size:13px}

  .verdict{margin-top:18px;border-radius:5px;padding:14px;border:1px solid var(--line)}
  .verdict.ok{border-color:var(--correct);background:var(--correct-soft)}
  .verdict.ng{border-color:var(--wrong);background:var(--wrong-soft)}
  .verdict h3{margin:0 0 6px;font-size:15px;font-family:var(--mincho);font-weight:600}
  .verdict p{margin:0;font-size:14px;line-height:1.75}
  .verdict .memo{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink-weak);white-space:pre-line}

  .note{font-size:12.5px;color:var(--ink-weak);margin-top:14px;line-height:1.7}
  .flag{
    display:inline-block;font-size:11.5px;color:var(--wrong);
    border:1px solid var(--wrong);border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:2px;
  }
  .empty{font-size:14px;color:var(--ink-weak)}
  .pick{display:flex;align-items:center;gap:10px;font-size:14px}
  .pick select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:#fff;color:inherit}
  .btn.danger{border-color:var(--wrong);color:var(--wrong)}
  .btn.danger:hover{background:var(--wrong-soft)}
  :focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

<header class="site">
  <h1>SPI 言語ドリル</h1>
  <span class="sub" id="bank-size"></span>
</header>

<!-- ホーム -->
<section id="home">
  <div class="modes">
    <button class="mode" id="btn-random">
      <b>ランダム出題</b>
      <span>収録問題からシャッフルして出題します。</span>
    </button>
    <button class="mode" id="btn-review">
      <b>間違えた問題の復習</b>
      <span id="review-desc">間違えた問題だけを出題します。</span>
    </button>
  </div>

  <div class="card" style="margin-top:14px">
    <label class="pick">1回の出題数
      <select id="q-num">
        <option value="10">10問</option>
        <option value="25">25問</option>
        <option value="0">すべて</option>
      </select>
    </label>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="stats">
      <div><b id="st-total">0</b>解いた問題</div>
      <div><b id="st-acc">—</b>正答率</div>
      <div><b id="st-weak">0</b>復習リスト</div>
    </div>
    <div class="actions">
      <button class="btn ghost small danger" id="btn-purge">保存データを完全に削除する</button>
    </div>
    <p class="note" id="storage-note"></p>
  </div>
</section>

<!-- 出題 -->
<section id="quiz" class="hidden">
  <div class="bar">
    <span id="q-mode"></span>
    <span class="count" id="q-count"></span>
  </div>

  <div class="card">
    <div class="instruction" id="q-instruction"></div>
    <div class="passage hidden" id="q-passage"></div>
    <p class="stem" id="q-stem"></p>

    <ul class="options" id="q-options"></ul>
    <div id="q-textwrap" class="hidden">
      <input type="text" id="q-text" autocomplete="off" placeholder="答えを入力">
    </div>

    <div class="actions">
      <button class="btn" id="btn-check">答え合わせ</button>
      <button class="btn hidden" id="btn-next">次の問題</button>
      <button class="btn ghost small" id="btn-home">ホームへ</button>
    </div>

    <div class="verdict hidden" id="q-verdict"></div>
  </div>
</section>

{"id": "p021", "type": "text", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "科学とは懐疑主義に基づく方法であり、実証性や再現性がともなっていなければならないということに加えて、もう一つの大切な科学の性質に累積性がある。累積性は、科学が科学であるために、もともと備えていなければいけない条件などではなかった。むしろ、科学が合理的方法として確立した結果、あとから備えることになってしまった性質だ。科学の仮説は、厳しい検証によってふるいにかけられる。したがって、検証を経て生き残った科学は、少なくともその時点では正しいものだ。そして、新しい観測データや実験事実が積み重なることにより、科学は最新バージョンへと更新される。そのため科学は常に最新のものが一番正しい。［　　］されると言っても、何もかもが新しくなり、古いものが役立たずになって、リセットされてしまうということではない。古いものは、その時点では正しい科学であった。多くの場合、新しい科学は古い科学の上に、それを含むように積み重なってできあがる。古い科学は、特定の条件下で近似的に成り立つ科学として、新しい科学の一部分に組み込まれるのだ。", "source": "（岸田一隆『科学コミュニケーション　理科の&lt;考え方&gt;をひらく』、平凡社）", "stem": "文中の空所［　　］に入れるべきことばを、文中から2文字で抜き出しなさい。", "answer": ["更新"], "memo": "本文中に「科学は最新バージョンへと更新される」とある。"},
{"id": "p022", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "科学とは懐疑主義に基づく方法であり、実証性や再現性がともなっていなければならないということに加えて、もう一つの大切な科学の性質に累積性がある。累積性は、科学が科学であるために、もともと備えていなければいけない条件などではなかった。むしろ、科学が合理的方法として確立した結果、あとから備えることになってしまった性質だ。科学の仮説は、厳しい検証によってふるいにかけられる。したがって、検証を経て生き残った科学は、少なくともその時点では正しいものだ。そして、新しい観測データや実験事実が積み重なることにより、科学は最新バージョンへと更新される。そのため科学は常に最新のものが一番正しい。［　　］されると言っても、何もかもが新しくなり、古いものが役立たずになって、リセットされてしまうということではない。古いものは、その時点では正しい科学であった。多くの場合、新しい科学は古い科学の上に、それを含むように積み重なってできあがる。古い科学は、特定の条件下で近似的に成り立つ科学として、新しい科学の一部分に組み込まれるのだ。", "source": "（岸田一隆『科学コミュニケーション　理科の&lt;考え方&gt;をひらく』、平凡社）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "科学は実証性や再現性をともなう", "B": "科学は懐疑主義に基づく方法である", "C": "厳しい検証を経た科学はその時点では正しい", "D": "科学は累積性により合理的方法として確立した"}, "answer": ["A", "B", "C"], "memo": "Dは因果が逆。合理的方法として確立した結果、あとから累積性を備えた。"},
{"id": "p023", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "科学とは懐疑主義に基づく方法であり、実証性や再現性がともなっていなければならないということに加えて、もう一つの大切な科学の性質に累積性がある。累積性は、科学が科学であるために、もともと備えていなければいけない条件などではなかった。むしろ、科学が合理的方法として確立した結果、あとから備えることになってしまった性質だ。科学の仮説は、厳しい検証によってふるいにかけられる。したがって、検証を経て生き残った科学は、少なくともその時点では正しいものだ。そして、新しい観測データや実験事実が積み重なることにより、科学は最新バージョンへと更新される。そのため科学は常に最新のものが一番正しい。［　　］されると言っても、何もかもが新しくなり、古いものが役立たずになって、リセットされてしまうということではない。古いものは、その時点では正しい科学であった。多くの場合、新しい科学は古い科学の上に、それを含むように積み重なってできあがる。古い科学は、特定の条件下で近似的に成り立つ科学として、新しい科学の一部分に組み込まれるのだ。", "source": "（岸田一隆『科学コミュニケーション　理科の&lt;考え方&gt;をひらく』、平凡社）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "科学は古くなるとリセットされる", "B": "最新の科学が一番正しいとは限らない", "C": "新しい科学は古い科学を含めて成り立つ", "D": "古い科学もかつては正しい科学であった"}, "answer": ["C", "D"], "memo": "本文は「リセットされてしまうということではない」「科学は常に最新のものが一番正しい」と述べている。"},
{"id": "p024", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "人のことを非難して悪く言う", "options": {"A": "そしる", "B": "やじる", "C": "あざける", "D": "ののしる", "E": "おとしめる"}, "answer": "A", "memo": "ののしる＝大声で悪口を言う。おとしめる＝見くだす、劣ったものとして扱う。"},
{"id": "p025", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "神仏をうやまい態度をつつしむ様子", "options": {"A": "畏怖（イフ）", "B": "帰依（キエ）", "C": "謹慎（キンシン）", "D": "敬虔（ケイケン）", "E": "謙譲", "F": "崇拝"}, "answer": "D", "memo": "崇拝＝とうとび拝むこと。"},
{"id": "p026", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "ものごとの扱い方がぞんざいなこと", "options": {"A": "横着", "B": "粗略（ソリャク）", "C": "疎漏（ソロウ）", "D": "無謀", "E": "乱暴"}, "answer": "B", "memo": "ぞんざい＝いい加減。疎漏＝注意が足りず手落ちがあること。"},
{"id": "p027", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "環境の改善に［　　］を置く", "options": {"A": "結論", "B": "主眼", "C": "趣旨", "D": "大意", "E": "命題"}, "answer": "B", "memo": "主眼＝最も重要な点、中心的な目的。"},
{"id": "p028", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "無作法を［　　］", "options": {"A": "なだめる", "B": "言い含める", "C": "たしなめる", "D": "説き伏せる", "E": "ほのめかす"}, "answer": "C", "memo": "なだめる＝穏やかに済ませる、怒りを静める。\n言い含める＝相手が納得するように言う。\nたしなめる＝反省をうながす。\n説き伏せる＝よく話をして相手を自分の考えに従わせる。\nほのめかす＝遠まわしに相手に伝える。"},
{"id": "p029", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "君の経験については問う<u>まい</u>", "options": {"A": "いくらなんでも行く<u>まい</u>", "B": "今年の冬は雪は降る<u>まい</u>", "C": "二度と失敗は繰り返す<u>まい</u>", "D": "わからないはずはある<u>まい</u>", "E": "これほど心強い味方もいる<u>まい</u>", "F": "名人といえどもこれはでき<u>まい</u>"}, "answer": "C", "memo": "「〜しないつもりだ」という意思。他は否定の推量。"},
{"id": "p030", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "作品に手が<u>入る</u>", "options": {"A": "家に泥棒が<u>入る</u>", "B": "弟が大学に<u>入る</u>", "C": "話に気合が<u>入る</u>", "D": "目にゴミが<u>入る</u>", "E": "けんかに仲裁が<u>入る</u>", "F": "部屋にすきま風が<u>入る</u>"}, "answer": "E", "memo": "手が加えられる、修正や改良が加えられるという意味。介入する。"},
{"id": "p031", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "<u>できる</u>だけやります", "options": {"A": "新しい家が<u>できる</u>", "B": "英語がよく<u>できる</u>", "C": "耳にたこが<u>できる</u>", "D": "いつでも入学<u>できる</u>", "E": "思わぬ急用が<u>できる</u>", "F": "体内に免疫が<u>できる</u>"}, "answer": "B", "flag": "要確認", "memo": "「可能な限り」の意味。\n※PDFでは「B or D」と迷った跡があり、Bが青で塗られています。青＝正解と判断してBにしています。"},
{"id": "p032", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "悲しむ ： 喜ぶ<br>　　侮る ： （　　）", "options": {"A": "従う", "B": "慎む", "C": "畏れる", "D": "気遣う", "E": "へつらう"}, "answer": "C", "memo": "侮る＝相手を軽んじたり見下したりする意味。反対は尊ぶ、敬うなど。"},
{"id": "p033", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "生物 ： 人間<br>　　才能 ： （　　）", "options": {"A": "芸術", "B": "天才", "C": "天才肌", "D": "能力", "E": "素質"}, "answer": "B", "memo": "包含関係。人間は生物の一種、天才は才能の一種。"},
{"id": "p034", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "春分の日も秋分の日も昼夜の長さは実際には同じではない。理由は、日の出と日の入りの［　　］にある。日の出も日の入りも太陽の上側の縁が地平線に接した瞬間としているので昼が長い。", "options": {"A": "角度", "B": "季節", "C": "時間", "D": "定義", "E": "場所"}, "answer": "D", "memo": ""},
{"id": "p035", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "人間は社会的動物であり、単独では暮らしていけない。そして周囲の環境に［　　］するのではなく、なんとか自己の存在性を表出し、それを他者に評価してもらおうとする生き物でもある。", "options": {"A": "我慢", "B": "調和", "C": "適応", "D": "配慮", "E": "反抗", "F": "埋没"}, "answer": "F", "memo": "埋没＝ある状態にひたりきって、そこから抜け出せないさま。"},
{"id": "p036", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "迷信を信じる人には、何かを体験したときにそれに対しての［1］［2］［3］［4］［5］傾向が見られるという<br><br>［2］にあてはまるものはつぎのうちどれか。", "options": {"A": "それに反する", "B": "証拠を無視する", "C": "その体験を裏付ける", "D": "確率的な判断ができず", "E": "証拠ばかりを求めてしまい"}, "answer": "C", "memo": "正しい語順は D→C→E→A→B。"},
{"id": "p037", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "ニューヨークのマンハッタン島にある［1］［2］［3］［4］［5］といわれている<br><br>［3］にあてはまるものはつぎのうちどれか。", "options": {"A": "ビーバーの毛皮との", "B": "ヨーロッパのビーズや生地と", "C": "ネイティブアメリカンが作った", "D": "物々交換が盛んに行われていた", "E": "ビーバーストリートのあたりでは"}, "answer": "C", "memo": "正しい語順は E→B→C→A→D。"},
{"id": "p038", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "差別化はほんとうに、どこまでも「他人とちがう」ことへの志向なのだろうか。それには否、と答えなければならない。人々は他の「誰（ダレ）でもない私」であることをぞ、実は望んではいない。「誰でもない私」とは、「何者でもない私」のことにすぎない。市民社会の個人主義が依拠した「私という絶対」は、大衆社会の相対の海の中にとっくに没してしまっている。私は高度成長期以降の人々の欲求性向を、「人なみ化」から「差別化」へと定式化したが、両者の関係は二段階のものと言うより、表裏一体に進行すると言ってよい。人々は「人とちがう」ことをのぞみながら、同時に「ちがいがわかる」限りで「人と同じ」であることをも望んでいる。栗本慎一郎氏はこれを「連他性」と呼んだ。大衆社会の欲望の構造をリースマンは「他者志向」と名づけたが、問題はこの「人なみ化」のモデルが目に見える均質の大衆から目に見えない幻想的な準拠集団へと変容を遂げていることなのだ。差別化と連他化のパラレルな進行の中で、「人なみ化」は分解現象を起こしている。「人なみ化」はなくなったわけではない。［　　］したのだ。", "source": "（上野千鶴子『増補＜私＞探しゲーム』、筑摩書房）", "stem": "文中の空所［　　］に入れることばとして最も適切なものは、つぎのうちどれか。", "options": {"A": "縮小", "B": "変質", "C": "均質化", "D": "顕在化"}, "answer": "B", "memo": ""},
{"id": "p039", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "差別化はほんとうに、どこまでも「他人とちがう」ことへの志向なのだろうか。それには否、と答えなければならない。人々は他の「誰（ダレ）でもない私」であることをぞ、実は望んではいない。「誰でもない私」とは、「何者でもない私」のことにすぎない。市民社会の個人主義が依拠した「私という絶対」は、大衆社会の相対の海の中にとっくに没してしまっている。私は高度成長期以降の人々の欲求性向を、「人なみ化」から「差別化」へと定式化したが、両者の関係は二段階のものと言うより、表裏一体に進行すると言ってよい。人々は「人とちがう」ことをのぞみながら、同時に「ちがいがわかる」限りで「人と同じ」であることをも望んでいる。栗本慎一郎氏はこれを「連他性」と呼んだ。大衆社会の欲望の構造をリースマンは「他者志向」と名づけたが、問題はこの「人なみ化」のモデルが目に見える均質の大衆から目に見えない幻想的な準拠集団へと変容を遂げていることなのだ。差別化と連他化のパラレルな進行の中で、「人なみ化」は分解現象を起こしている。「人なみ化」はなくなったわけではない。［　　］したのだ。", "source": "（上野千鶴子『増補＜私＞探しゲーム』、筑摩書房）", "stem": "「人なみ化」について文中で述べられていることは、つぎのうちどれか。", "options": {"A": "差別化とは相反する志向である", "B": "高度成長期以降の人々の目標である", "C": "最初は均質の大衆をモデルとしていた", "D": "リースマンの「他者志向」と同様のことである"}, "answer": ["C", "D"], "flag": "要確認", "memo": "差別化と「人なみ化」は表裏一体に進行するとあるのでAは誤り。\n※PDFでは赤字で「CとD?」と迷った跡があります。"},
{"id": "p040", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "差別化はほんとうに、どこまでも「他人とちがう」ことへの志向なのだろうか。それには否、と答えなければならない。人々は他の「誰（ダレ）でもない私」であることをぞ、実は望んではいない。「誰でもない私」とは、「何者でもない私」のことにすぎない。市民社会の個人主義が依拠した「私という絶対」は、大衆社会の相対の海の中にとっくに没してしまっている。私は高度成長期以降の人々の欲求性向を、「人なみ化」から「差別化」へと定式化したが、両者の関係は二段階のものと言うより、表裏一体に進行すると言ってよい。人々は「人とちがう」ことをのぞみながら、同時に「ちがいがわかる」限りで「人と同じ」であることをも望んでいる。栗本慎一郎氏はこれを「連他性」と呼んだ。大衆社会の欲望の構造をリースマンは「他者志向」と名づけたが、問題はこの「人なみ化」のモデルが目に見える均質の大衆から目に見えない幻想的な準拠集団へと変容を遂げていることなのだ。差別化と連他化のパラレルな進行の中で、「人なみ化」は分解現象を起こしている。「人なみ化」はなくなったわけではない。［　　］したのだ。", "source": "（上野千鶴子『増補＜私＞探しゲーム』、筑摩書房）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "人とちがうことと人と同じことは両立しない", "B": "「人なみ化」のモデルはたえず見えるものとして存在する", "C": "人々が望むのはちがいがわかる限りで人と同じことである", "D": "差別化とはどこまでも他人とちがうことを追求することである"}, "answer": ["C"], "memo": "モデルは目に見えない幻想的な準拠集団へと変容しているのでBは誤り。"},
{"id": "p041", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "常識や慣習にとらわれず思うままにふるまうこと", "options": {"A": "奔放", "B": "邁（マイ）進", "C": "破天荒", "D": "身勝手", "E": "天真爛（ラン）漫"}, "answer": "A", "memo": "邁進＝元気よく目的に向かって進む。\n破天荒＝だれもしたことのないことをする。\n身勝手＝迷惑をかえりみず自分の都合で行動する。\n天真爛漫＝飾らず心の中がそのまま表れている。"},
{"id": "p042", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "おおいをしてさえぎること", "options": {"A": "隠匿", "B": "隔離", "C": "遮蔽（シャヘイ）", "D": "被覆", "E": "分断"}, "answer": "C", "memo": "隠匿＝隠してはいけないものを隠す。\n隔離＝へだてる、引き離す。\n被覆＝他の物でおおいかぶせる、おおい包む。\n分断＝分けて別々にする。"},
{"id": "p043", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "神妙に", "options": {"A": "美しく", "B": "律儀に", "C": "味わい深く", "D": "かしこまって", "E": "一風変わって"}, "answer": "D", "memo": "神妙＝素直でおとなしい様子、慎み深い様子。"},
{"id": "p044", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "誤りや手抜きが多くていい加減なこと", "options": {"A": "迂闊（ウカツ）", "B": "杜撰（ズサン）", "C": "粗末", "D": "怠慢", "E": "乱雑"}, "answer": "B", "memo": "迂闊＝注意が足りずぼんやりしている。\n粗末＝大切に扱わない。\n怠慢＝なまけおこたる。\n乱雑＝入り乱れている。"},
{"id": "p045", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "手当たり次第、本を読むこと", "options": {"A": "多読", "B": "通読", "C": "読破", "D": "読了", "E": "濫読（ランドク）"}, "answer": "E", "memo": "多読＝本をたくさん読む。\n通読＝全体をひと通り読む。\n読破＝終わりまで読み通す。\n読了＝読み終える。"},
{"id": "p046", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "とっさに働く鋭い知恵", "options": {"A": "鋭敏", "B": "機知", "C": "才気", "D": "即断", "E": "利発"}, "answer": "B", "memo": "鋭敏＝物事を鋭く感じとる。\n才気＝すぐれた頭のはたらき。\n即断＝すぐにその場で決める。\n利発＝かしこい、頭の回転が速い。"},
{"id": "p047", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "流行の［　　］をたどる", "options": {"A": "変異", "B": "変化", "C": "変更", "D": "変遷（ヘンセン）", "E": "変動"}, "answer": "D", "memo": ""},
{"id": "p048", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "［　　］に追い込まれる", "options": {"A": "議案", "B": "懸案", "C": "対案", "D": "代案", "E": "廃案", "F": "発案"}, "answer": "E", "memo": "議案＝会議にかけるもの。\n懸案＝かねてから問題になっていること。\n対案・代案＝代わりに出す案。\n発案＝考え出すこと。"},
{"id": "p049", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "それは［　　］見方だ", "options": {"A": "突いた", "B": "うがった", "C": "えぐった", "D": "刺さった", "E": "ほじくった"}, "answer": "B", "memo": "うがつ＝穴を掘る。転じて、物事を深く見抜く、隠された部分に迫る。"},
{"id": "p050", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "洗濯で衣類の丈が<u>つまる</u>", "options": {"A": "返す言葉に<u>つまる</u>", "B": "煤（スス）で煙突が<u>つまる</u>", "C": "餅（モチ）がのどに<u>つまる</u>", "D": "悲しみで胸が<u>つまる</u>", "E": "仕事の予定が<u>つまる</u>", "F": "先頭との差が<u>つまる</u>"}, "answer": "F", "memo": "長さや間隔が短くなること。"},
{"id": "p051", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "一晩寝れば疲れが<u>とれる</u>", "options": {"A": "1年に米が2回<u>とれる</u>", "B": "左右のバランスが<u>とれる</u>", "C": "社会に出れば角が<u>とれる</u>", "D": "全体として調和が<u>とれる</u>", "E": "その川ではアユが<u>とれる</u>", "F": "表面上は賛成とも<u>とれる</u>"}, "answer": "C", "memo": "好ましくないものが解消して、なくなること。"},
{"id": "p052", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "人<u>通り</u>が絶えない", "options": {"A": "裏<u>通り</u>を抜ける", "B": "風の<u>通り</u>が悪い", "C": "広い<u>通り</u>に出る", "D": "世間の<u>通り</u>がよい", "E": "ひと<u>通り</u>説明する", "F": "元<u>通り</u>にして返す"}, "answer": "B", "memo": "通ること、行き来すること。"},
{"id": "p053", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "安全 ： 危険<br>　　率直 ： （　　）", "options": {"A": "屈折", "B": "内密", "C": "慎重", "D": "穏便", "E": "婉（エン）曲"}, "answer": "E", "memo": "対義語の関係。"},
{"id": "p054", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "病気 ： 仮病<br>　　不在 ： （　　）", "options": {"A": "外出", "B": "在宅", "C": "留守", "D": "空き巣", "E": "居留守"}, "answer": "E", "memo": "本物と偽物の関係。実際には在宅なのに不在のふりをするのが居留守。"},
{"id": "p055", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "自らが所属している職業集団における規則をしゃくし定規に守ったために、結果として世間の批判を浴びるというケースがある。このようなことが起こるのは、行動規範として［①］よりも［②］が優先されたためである。", "options": {"A": "①社会の論理　②世間の批判", "B": "①社会の論理　②集団の価値観", "C": "①世間の批判　②社会の論理", "D": "①世間の批判　②集団の価値観", "E": "①集団の価値観　②社会の論理", "F": "①集団の価値観　②世間の批判"}, "answer": "B", "memo": ""},
{"id": "p056", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "文章は一本の線のような構造をなしており、その構造に沿って［　　］理解するのだ。同じような理解のプロセスを示すのが音楽で、一瞬で全体を捉（トラ）えられる絵画とは性格が異なる。", "options": {"A": "知識を使って", "B": "順に読み進めて", "C": "想像を働かせて", "D": "テーマを考えながら", "E": "書き手の意図のもとに", "F": "読み手の能力の範囲で"}, "answer": "B", "memo": ""},
{"id": "p057", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "同素体は、同じ元素からできているが［1］［2］［3］［4］［5］フラーレンやカーボンナノチューブなどがある<br><br>［2］にあてはまるものはつぎのうちどれか。", "options": {"A": "性質の違う単体のことで", "B": "たとえば炭素の同素体には", "C": "新素材として注目されている", "D": "ダイヤモンドと黒鉛のほかに", "E": "その原子配列や結合が異なるため"}, "answer": "A", "memo": "正しい語順は E→A→B→D→C。"},
{"id": "p058", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "私たちが日常利用する水には［1］［2］［3］［4］［5］これらの元素である<br><br>［3］にあてはまるものはつぎのうちどれか。", "options": {"A": "風呂や洗濯の時の", "B": "水の硬度の指標であるが", "C": "さまざまな成分が含まれており", "D": "せっけんカスの原因となるのは", "E": "その中でカルシウムとマグネシウムは"}, "answer": "B", "memo": "正しい語順は C→E→B→A→D。"},
{"id": "p059", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "現代人は行進などで手を振って歩く。右足が出れば左手が前、右手は後に振って弾みをつける。ところが、江戸時代以前の日本人はほとんど手を振らず、身体をねじらない、いわゆる「ナンバ歩き」をしていた。ナンバとは竹馬に乗ったような形だ。右足を前へ運ぶ際、右手も右半身もそろって前へ出る。武術の型にはもちろん、盆踊りなどにもこのスタイルは残る。和服は身体をねじると着崩れるため、着慣れると自然と手が胴体に添ってくるようだ。ナンバは勢いや反動が使いにくく、現代人には一見動きづらく思える。が、見方を変えれば、前進する時に後へ手を振るのは、力の打ち消し合いともいえる。足腰をリラックスさせ、自分の体重を感じながら重心を前へ移していき、自ずと足が前へ出るように歩いたほうが［　　］動きだ。", "source": "（多田容子「（心体観測）武術の眼」『朝日新聞』2007年8月5日）", "stem": "文中の空所［　　］に入れる語句として最も適切なものは、つぎのうちどれか。", "options": {"A": "簡単な", "B": "困難な", "C": "省エネな", "D": "無駄が多い"}, "answer": "C", "memo": ""},
{"id": "p060", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）", "passage": "現代人は行進などで手を振って歩く。右足が出れば左手が前、右手は後に振って弾みをつける。ところが、江戸時代以前の日本人はほとんど手を振らず、身体をねじらない、いわゆる「ナンバ歩き」をしていた。ナンバとは竹馬に乗ったような形だ。右足を前へ運ぶ際、右手も右半身もそろって前へ出る。武術の型にはもちろん、盆踊りなどにもこのスタイルは残る。和服は身体をねじると着崩れるため、着慣れると自然と手が胴体に添ってくるようだ。ナンバは勢いや反動が使いにくく、現代人には一見動きづらく思える。が、見方を変えれば、前進する時に後へ手を振るのは、力の打ち消し合いともいえる。足腰をリラックスさせ、自分の体重を感じながら重心を前へ移していき、自ずと足が前へ出るように歩いたほうが［　　］動きだ。", "source": "（多田容子「（心体観測）武術の眼」『朝日新聞』2007年8月5日）", "stem": "つぎのうちナンバに<u>あてはまらない</u>ものはどれか。", "options": {"A": "竹馬", "B": "武術", "C": "行進", "D": "盆踊り"}, "answer": "C", "memo": "行進は手を振って身体をねじる歩き方。"},
{"id": "p061", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）", "passage": "現代人は行進などで手を振って歩く。右足が出れば左手が前、右手は後に振って弾みをつける。ところが、江戸時代以前の日本人はほとんど手を振らず、身体をねじらない、いわゆる「ナンバ歩き」をしていた。ナンバとは竹馬に乗ったような形だ。右足を前へ運ぶ際、右手も右半身もそろって前へ出る。武術の型にはもちろん、盆踊りなどにもこのスタイルは残る。和服は身体をねじると着崩れるため、着慣れると自然と手が胴体に添ってくるようだ。ナンバは勢いや反動が使いにくく、現代人には一見動きづらく思える。が、見方を変えれば、前進する時に後へ手を振るのは、力の打ち消し合いともいえる。足腰をリラックスさせ、自分の体重を感じながら重心を前へ移していき、自ずと足が前へ出るように歩いたほうが［　　］動きだ。", "source": "（多田容子「（心体観測）武術の眼」『朝日新聞』2007年8月5日）", "stem": "ナンバ歩きの特徴として文中で述べられているものは、つぎのうちどれか。", "options": {"A": "力を打ち消し合う", "B": "手を振って弾みをつける", "C": "勢いや反動を使いやすい", "D": "体重を感じながら重心を前へ移す"}, "answer": "D", "memo": ""},
{"id": "p062", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "昔の時代を慕わしく思うこと", "options": {"A": "追憶", "B": "旧弊", "C": "懐古", "D": "復古", "E": "望郷"}, "answer": "C", "memo": "追憶＝過去のことを思い出す。\n旧弊＝古いしきたりの弊害。\n復古＝昔の状態にかえること。\n望郷＝故郷を慕う。"},
{"id": "p063", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "事態が迫っているのに、急ごうとしない様子", "options": {"A": "怠惰", "B": "緩慢", "C": "泰然", "D": "沈着", "E": "悠長（ユウチョウ）"}, "answer": "E", "memo": "怠惰＝なまけている。\n緩慢＝動きがのろい。\n泰然＝落ち着いていて動じない。\n沈着＝冷静。"},
{"id": "p064", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "差し障りがあることを感じて遠慮する", "options": {"A": "はばかる", "B": "ゆだねる", "C": "あまんずる", "D": "かしこまる", "E": "へりくだる"}, "answer": "A", "memo": "あまんずる＝甘受する。\nかしこまる＝礼儀正しくする。\nへりくだる＝謙遜する。"},
{"id": "p065", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "わざわいの起こるもと", "options": {"A": "禍根（カコン）", "B": "凶兆", "C": "災厄", "D": "難儀", "E": "不吉"}, "answer": "A", "memo": "凶兆＝何か悪いことが起こりそうな前触れ。\n災厄＝わざわい、災難。\n難儀＝困難、苦労。"},
{"id": "p066", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "社会事業や慈善活動を積極的に援助する人", "options": {"A": "資産家", "B": "人格者", "C": "篤志家（トクシカ）", "D": "奉仕者", "E": "名望家"}, "answer": "C", "memo": ""},
{"id": "p067", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "頭がよく賢いこと", "options": {"A": "機敏", "B": "多才", "C": "博識", "D": "非凡", "E": "有能", "F": "利発"}, "answer": "F", "memo": ""},
{"id": "p068", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "慌てふためくこと", "options": {"A": "驚愕（キョウガク）", "B": "困惑", "C": "焦燥", "D": "動揺", "E": "狼狽（ロウバイ）"}, "answer": "E", "memo": "焦燥＝いらだち、あせること。\n狼狽＝うろたえること。"},
{"id": "p069", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "その物事に<u>うとい</u>", "options": {"A": "外野", "B": "素人", "C": "部外者", "D": "門外漢", "E": "野次馬"}, "answer": "D", "memo": "疎い＝ある分野についての知識や理解が不十分。\n野次馬＝自分に無関係なことを面白半分に見て回る人。"},
{"id": "p070", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "うつつ", "options": {"A": "夢", "B": "退屈", "C": "現実", "D": "狂気", "E": "時間"}, "answer": "C", "memo": "うつつ＝現実、正気。"},
{"id": "p071", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "ものごとの扱い方がぞんざいなこと", "options": {"A": "横着", "B": "粗略（ソリャク）", "C": "疎漏（ソロウ）", "D": "無謀", "E": "乱暴"}, "answer": "B", "memo": "横着＝ずるく怠ける。\n疎漏＝注意が足りず、見落としがある。"},
{"id": "p072", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "犬が尾を［　　］ほど振る", "options": {"A": "折れる", "B": "取れる", "C": "離れる", "D": "もげる", "E": "ちぎれる"}, "answer": "E", "flag": "要確認", "memo": "「尾をちぎれるほど振る」が慣用的な言い方。\n※PDFでは赤字でEと書かれ、Dが青で塗られています。ここは赤字を採用しています。"},
{"id": "p073", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "契約を［　　］する", "options": {"A": "敢行", "B": "挙行", "C": "決行", "D": "施行", "E": "断行", "F": "履行"}, "answer": "F", "memo": "敢行＝困難を押し切って行う。\n挙行＝儀式などを行う。\n施行＝法律や規則を実施する。\n断行＝強い意志をもって行う。\n履行＝約束や義務を実行する。"},
{"id": "p074", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "引導を［　　］", "options": {"A": "送る", "B": "施す", "C": "譲る", "D": "渡す", "E": "与える", "F": "授ける"}, "answer": "D", "memo": "引導を渡す＝人を悟りに導く。転じて、最終的な宣告をすること。\n授ける＝上の者から下の者へ賜る。"},
{"id": "p075", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "そうと<u>ばかり</u>は言えない", "options": {"A": "彼は勉強<u>ばかり</u>している", "B": "とびあがらん<u>ばかり</u>に喜ぶ", "C": "私が忘れた<u>ばかり</u>に迷惑をかけた", "D": "50メートル<u>ばかり</u>行ったところにある", "E": "出かける<u>ばかり</u>のところに行きあわせた"}, "answer": "A", "memo": "限定を表す用法。「そうだとは限らない」の意味。"},
{"id": "p076", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "着物の丈を<u>つめる</u>", "options": {"A": "息を<u>つめる</u>", "B": "根（コン）を<u>つめる</u>", "C": "席を<u>つめる</u>", "D": "間（マ）を<u>つめる</u>", "E": "水を<u>つめる</u>", "F": "線を<u>つめる</u>"}, "answer": "D", "memo": "長さや間隔を短くすること。"},
{"id": "p077", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "彼<u>まで</u>もが聞いてくれない", "options": {"A": "夢に<u>まで</u>見る", "B": "考える<u>まで</u>もない", "C": "夜明け<u>まで</u>降り続く", "D": "週末<u>まで</u>待ってください", "E": "言わない<u>まで</u>も考えておく", "F": "とりあえずお礼の気持ち<u>まで</u>"}, "answer": "A", "memo": "ある範囲が予想外に広がっていることを表す。"},
{"id": "p078", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "交通 ： 渋滞<br>　　稲作 ： （　　）", "options": {"A": "水田", "B": "不作", "C": "農家", "D": "収穫", "E": "田植え"}, "answer": "B", "memo": "渋滞は交通の障害。不作は稲作の障害。"},
{"id": "p079", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "安全 ： 危険<br>　　独自性 ： （　　）", "options": {"A": "相対性", "B": "多様性", "C": "抽象性", "D": "同一性", "E": "類似性"}, "answer": "D", "memo": "対義語の関係。"},
{"id": "p080", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "普遍性と同一性の発見は、おそらくそれ自体では祝福されるべき事態だと思います。なによりそれは、孤独や孤立や絶望に対処するための、最も有効な手段です。「［　　］」と考えて気が楽になるのは、こうした場合です。", "options": {"A": "人は人だから", "B": "自分にかぎっては", "C": "自分は特別だから", "D": "自分なんかどうでも", "E": "だれでもみんなある程度は"}, "answer": "E", "memo": ""},
{"id": "p081", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "イギリスの風景式庭園は西洋の庭園の歴史上、唯一の非整形式庭園である。それは、フランスの幾何学式庭園に見られる、造形性が強く画一的な図形や規則的な秩序とは異なり、自由で多様な自然の景観美という［　　］な部分に美を見いだしている点が特徴的である。", "options": {"A": "可変的", "B": "創造的", "C": "対称的", "D": "非連続", "E": "不規則"}, "answer": "E", "memo": ""},
{"id": "p082", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "ストレスということばは、生理学者ハンス・セリエが［1］［2］［3］［4］［5］当時は心の働きはあまり着目されていなかった<br><br>［2］にあてはまるものはつぎのうちどれか。", "options": {"A": "使われ始めたのだが", "B": "刺激の種類に関係なく", "C": "ストレス学説を発表して", "D": "反応とプロセスは同様という", "E": "その刺激に適応していくときの"}, "answer": "E", "memo": "正しい語順は B→E→D→C→A。"},
{"id": "p083", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）あてはまるものをすべて選びなさい。", "passage": "和紙の量産体制のための最大の課題は原料で、ミツマタが主原料としての地位を確保したのは近代になってからである。ミツマタの皮は石灰で煮熟すると、赤みがかるのが欠点であったが、ソーダ灰で煮熟して晒（サラシ）粉で漂白すると良好な紙料となるので、明治12年に印刷局が紙幣用紙の原料として採用し、広く栽培されるようになった。このミツマタはガンピに代用し、これで漉（ス）いた半紙を「改良半紙」と呼んだ。機械すき洋紙の主原料である木材パルプは、明治20年に長野県でコウゾ原料に混入して半紙・障子紙を漉いているが、大産地の高知県や岐阜県では、明治28年から補助原料として導入し、やがて愛媛・福井県でも用いはじめた。マニラ麻は明治末期から大正期にかけて発展した機械すき和紙の最も重要な原料となり、手すき和紙の補助原料としても利用されている。原料煮熟に用いるアルカリ性の液は、もともと草木灰あるいは石灰であったが、紙幣抄紙局で明治9年にソーダ灰を使いはじめ、これに水酸化カルシウムを反応させた苛（カ）性ソーダの利用が和紙業界に波及した。", "source": "（久米康生『和紙の源流』、岩波書店）", "stem": "ミツマタについて文中で述べられていることは、つぎのうちどれか。", "options": {"A": "紙幣用紙の原料として採用されてから栽培が広まった", "B": "ソーダ灰で煮熟すると赤みがかるという欠点があった", "C": "ガンピの補助原料として「改良半紙」の製造に使われた", "D": "近代になってから和紙の主原料としての地位を確保した"}, "answer": ["A", "D"], "memo": "赤みがかるのは石灰で煮熟した場合。またガンピの補助原料ではなく代用として使われた。"},
{"id": "p084", "type": "text", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）", "passage": "和紙の量産体制のための最大の課題は原料で、ミツマタが主原料としての地位を確保したのは近代になってからである。ミツマタの皮は石灰で煮熟すると、赤みがかるのが欠点であったが、ソーダ灰で煮熟して晒（サラシ）粉で漂白すると良好な紙料となるので、明治12年に印刷局が紙幣用紙の原料として採用し、広く栽培されるようになった。このミツマタはガンピに代用し、これで漉（ス）いた半紙を「改良半紙」と呼んだ。機械すき洋紙の主原料である木材パルプは、明治20年に長野県でコウゾ原料に混入して半紙・障子紙を漉いているが、大産地の高知県や岐阜県では、明治28年から補助原料として導入し、やがて愛媛・福井県でも用いはじめた。マニラ麻は明治末期から大正期にかけて発展した機械すき和紙の最も重要な原料となり、手すき和紙の補助原料としても利用されている。原料煮熟に用いるアルカリ性の液は、もともと草木灰あるいは石灰であったが、紙幣抄紙局で明治9年にソーダ灰を使いはじめ、これに水酸化カルシウムを反応させた苛（カ）性ソーダの利用が和紙業界に波及した。", "source": "（久米康生『和紙の源流』、岩波書店）", "stem": "つぎの文の空所［　　］に入れるべきことばを、本文中から5文字以内で抜き出しなさい。<br><br>明治期の和紙業界は、原料確保に努めながら、機械を導入し、化学薬品を活用して、［　　］の確立をめざした。", "answer": ["量産体制"], "memo": ""},
{"id": "p085", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "和紙の量産体制のための最大の課題は原料で、ミツマタが主原料としての地位を確保したのは近代になってからである。ミツマタの皮は石灰で煮熟すると、赤みがかるのが欠点であったが、ソーダ灰で煮熟して晒（サラシ）粉で漂白すると良好な紙料となるので、明治12年に印刷局が紙幣用紙の原料として採用し、広く栽培されるようになった。このミツマタはガンピに代用し、これで漉（ス）いた半紙を「改良半紙」と呼んだ。機械すき洋紙の主原料である木材パルプは、明治20年に長野県でコウゾ原料に混入して半紙・障子紙を漉いているが、大産地の高知県や岐阜県では、明治28年から補助原料として導入し、やがて愛媛・福井県でも用いはじめた。マニラ麻は明治末期から大正期にかけて発展した機械すき和紙の最も重要な原料となり、手すき和紙の補助原料としても利用されている。原料煮熟に用いるアルカリ性の液は、もともと草木灰あるいは石灰であったが、紙幣抄紙局で明治9年にソーダ灰を使いはじめ、これに水酸化カルシウムを反応させた苛（カ）性ソーダの利用が和紙業界に波及した。", "source": "（久米康生『和紙の源流』、岩波書店）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "マニラ麻は機械すき和紙の補助原料としても利用されていた", "B": "木材パルプは洋紙ばかりでなく和紙の主原料としても使われた", "C": "和紙の原料煮熟には苛性ソーダが用いられることが多くなった", "D": "コウゾは明治半ばごろから機械すき洋紙の主原料として用いられた"}, "answer": ["C"], "memo": "マニラ麻は機械すき和紙の最も重要な原料であり、補助原料として使われたのは手すき和紙。木材パルプは和紙では補助原料。"},
{"id": "p086", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "基本的には人間は他人との距離をある程度維持しようと努めている。他人が近づいてくると不快に感じてしまうような自分の縄張りを無意識に人間は持っている。パーソナルスペースである。物理学では反発する力のことを斥力と呼んでいるため、パーソナルスペースは人の持つ斥力圏と考えることができる。その距離は、人の密度や速度などによって変わるし、また知り合い同士の場合の距離は短くなる。かなり親しい場合の距離は50cm以下といわれており、文字どおりその間に他人が入れない距離だ。赤の他人の場合は3m以上離れようとする傾向もあるそうだが、混雑してくるとその限りではない。相手が権威のある人の場合、パーソナルスペースが大きくなることも知られているが、「［　　］」という表現がまさにこれに相当するだろう。偉い人と話す場合、日本人は目を伏せがちにして少し離れた位置で話す。あまり近づかない方が礼儀正しいとされる。しかし欧米ではふつうはまず握手をして、相手の目をしっかり見て話すのが礼儀なので、私はパーソナルスペースの大きさを外国ではスイッチして使い分けている。", "source": "（西成活裕『渋滞学』、新潮社）", "stem": "文中の空所［　　］に入れることばとして最も適切なものは、つぎのうちどれか。", "options": {"A": "遠巻きに見る", "B": "近寄り難い存在", "C": "割り込むすきもない", "D": "距離をおいてつき合う"}, "answer": "B", "memo": ""},
{"id": "p087", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "基本的には人間は他人との距離をある程度維持しようと努めている。他人が近づいてくると不快に感じてしまうような自分の縄張りを無意識に人間は持っている。パーソナルスペースである。物理学では反発する力のことを斥力と呼んでいるため、パーソナルスペースは人の持つ斥力圏と考えることができる。その距離は、人の密度や速度などによって変わるし、また知り合い同士の場合の距離は短くなる。かなり親しい場合の距離は50cm以下といわれており、文字どおりその間に他人が入れない距離だ。赤の他人の場合は3m以上離れようとする傾向もあるそうだが、混雑してくるとその限りではない。相手が権威のある人の場合、パーソナルスペースが大きくなることも知られているが、「［　　］」という表現がまさにこれに相当するだろう。偉い人と話す場合、日本人は目を伏せがちにして少し離れた位置で話す。あまり近づかない方が礼儀正しいとされる。しかし欧米ではふつうはまず握手をして、相手の目をしっかり見て話すのが礼儀なので、私はパーソナルスペースの大きさを外国ではスイッチして使い分けている。", "source": "（西成活裕『渋滞学』、新潮社）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "人は自分の縄張りを感じることはない", "B": "人は斥力圏を侵されると不快に感じる", "C": "他人との不快でない距離は速度の影響を受けない", "D": "国や文化によってパーソナルスペースの大きさは異なる"}, "answer": ["B", "D"], "memo": "距離は人の密度や速度などによって変わるとあるのでCは誤り。"},
{"id": "p088", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "基本的には人間は他人との距離をある程度維持しようと努めている。他人が近づいてくると不快に感じてしまうような自分の縄張りを無意識に人間は持っている。パーソナルスペースである。物理学では反発する力のことを斥力と呼んでいるため、パーソナルスペースは人の持つ斥力圏と考えることができる。その距離は、人の密度や速度などによって変わるし、また知り合い同士の場合の距離は短くなる。かなり親しい場合の距離は50cm以下といわれており、文字どおりその間に他人が入れない距離だ。赤の他人の場合は3m以上離れようとする傾向もあるそうだが、混雑してくるとその限りではない。相手が権威のある人の場合、パーソナルスペースが大きくなることも知られているが、「［　　］」という表現がまさにこれに相当するだろう。偉い人と話す場合、日本人は目を伏せがちにして少し離れた位置で話す。あまり近づかないほうが礼儀正しいとされる。しかし欧米ではふつうはまず握手をして、相手の目をしっかり見て話すのが礼儀なので、私はパーソナルスペースの大きさを外国ではスイッチして使い分けている。", "source": "（西成活裕『渋滞学』、新潮社）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "人は赤の他人との距離を常に3m以上とろうとする", "B": "他人と話すときの距離のとり方は礼儀にもかかわってくる", "C": "日本人同士でも初対面の人とは距離を縮めて挨（アイ）拶（サツ）した方がよい", "D": "日本人はかなり親しくても相手との距離が50cm以下にはならない"}, "answer": ["B"], "memo": "混雑時は3m以上とれないこともあり、親しい場合の距離は50cm以下とされている。"},
{"id": "p089", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "昆虫は移動という手段で［1］［2］［3］［4］［5］危惧（グ）される<br><br>［4］にあてはまるものはつぎのうちどれか。", "options": {"A": "崩れてしまい", "B": "昆虫と植物の同調性が", "C": "植食性の昆虫の絶滅が", "D": "植物の場合は難しいので", "E": "温暖化に対応することができるが"}, "answer": "A", "memo": "正しい語順は E→D→B→A→C。"},
{"id": "p090", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "異分野の研究者と一緒に仕事をする場合、他分野の知識は実はそれほど必要ではなく、むしろ必要なのは自分自身の分野についての豊富な学識だ。相手が望んでいるのはこちらの分野の［①］知識であって、［②］分野に関する生半可な知識など要らないのである。", "options": {"A": "①一般的な　②相手方の", "B": "①一般的な　②お互いの", "C": "①一般的な　②こちらの", "D": "①専門的な　②相手方の", "E": "①専門的な　②お互いの", "F": "①専門的な　②こちらの"}, "answer": "D", "memo": ""},
{"id": "p091", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "江戸時代、俳諧や和算など多くの人びとの間に流行した趣味の会合には、さまざまな身分の人間が集まった。そのような集まりは、封建社会の中にあっても、［　　］な人と人のつながりで私的に交流できる貴重な場であった。", "options": {"A": "強固", "B": "近接", "C": "広範", "D": "親密", "E": "対等"}, "answer": "E", "memo": ""},
{"id": "p092", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "飛行機 ： 空港<br>　　船 ： （　　）", "options": {"A": "出港", "B": "航路", "C": "埠（フ）頭", "D": "船舶", "E": "甲板"}, "answer": "C", "memo": "発着する場所の関係。"},
{"id": "p093", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "文芸 ： 短歌<br>　　血管 ： （　　）", "options": {"A": "血圧", "B": "血液", "C": "心臓", "D": "動脈", "E": "白血球"}, "answer": "D", "memo": "包含関係。短歌は文芸の一種、動脈は血管の一種。"},
{"id": "p094", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "再会の誓いで文を<u>むすぶ</u>", "options": {"A": "助詞で主語と述語を<u>むすぶ</u>", "B": "巧みな話術で協定を<u>むすぶ</u>", "C": "怒りで真一文字に口を<u>むすぶ</u>", "D": "部長のことばで歓迎会を<u>むすぶ</u>", "E": "インターネットで世界中を<u>むすぶ</u>"}, "answer": "D", "memo": "終わりにする、締めくくるという意味。"},
{"id": "p095", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "こう考えてよかろ<u>う</u>", "options": {"A": "早く行こ<u>う</u>よ", "B": "返事を書こ<u>う</u>", "C": "成功するでしょ<u>う</u>", "D": "ひとつあげましょ<u>う</u>", "E": "さっさとやってもらお<u>う</u>", "F": "誰が行こ<u>う</u>が行くまいが私の勝手だ"}, "answer": "C", "memo": "推量・判断を表す用法。"},
{"id": "p096", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "好敵手に闘志が<u>わく</u>", "options": {"A": "感動で涙が<u>わく</u>", "B": "熱戦で観客が<u>わく</u>", "C": "噴火で温泉が<u>わく</u>", "D": "山の上から雲が<u>わく</u>", "E": "話をきいて疑いが<u>わく</u>", "F": "賛否をめぐって議論が<u>わく</u>"}, "answer": "E", "memo": "心の中に自然に生じること。"},

{"id": "p098", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "惨敗を［　　］", "options": {"A": "喫する", "B": "剰する", "C": "屈する", "D": "呈する", "E": "拝する", "F": "浴する"}, "answer": "A", "memo": "喫する＝好ましくないことを身に受ける。"},
{"id": "p099", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "溜（リュウ）飲を［　　］", "options": {"A": "絶つ", "B": "保つ", "C": "重ねる", "D": "下げる", "E": "ためる", "F": "のみこむ"}, "answer": "D", "memo": "溜飲を下げる＝胸をすっきりさせる、気を晴らす。"},
{"id": "p100", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "束縛や制限がなく、思うようにしてよいこと", "options": {"A": "我意", "B": "放意", "C": "随意", "D": "本意", "E": "有意"}, "answer": "C", "memo": "我意＝自分の考えを押し通そうとすること、わがまま。\n随意＝強制がなく自由であること。"},
{"id": "p101", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "正しい在り方に反する", "options": {"A": "たがう", "B": "もとる", "C": "あらがう", "D": "たてつく", "E": "はずれる"}, "answer": "B", "memo": "たがう＝違う、異なる。\nあらがう・たてつく＝反抗する。\nはずれる＝外れる、逸れる。"},
{"id": "p102", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "その気になるようにそそのかす", "options": {"A": "いざなう", "B": "おだてる", "C": "かき立てる", "D": "たき付ける", "E": "持ち掛ける"}, "answer": "D", "memo": "いざなう＝誘う、勧める。\nおだてる＝褒めてその気にさせる。\nかき立てる＝感情や気持ちを強く高める。\n持ち掛ける＝提案する。"},
{"id": "p103", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "故岡彦一博士はアジアの古いイネ品種を多数集め、それらのうち代表的な百あまりの品種について何十という遺伝的な性質を丹念に調べあげ、百余×<u>数十</u>の大きな表を作り品種の分類を試みた。こういう分析をすると、多くの場合、遺伝的な性質の組み合わせは無数にできて分類は困難を極めそうなものである。しかし、おもしろいことに多くのイネの品種は、それら無数にも近い数の組み合わせのうちのある特定のものに集中した。フェノール反応（a）、塩素酸カリ抵抗性（b）、ふ毛の長さ（c）、という3つの遺伝的性質に注目してみよう。aについてはプラスかマイナス、bについては強いか弱い、cについては長いか短い、のそれぞれ2つのクラスにわけると、遺伝的性質の組み合わせは8つできる。ところがこの8つの組み合わせのうち、圧倒的多数の品種が、「a：プラス、b：弱、c：短」と「a：マイナス、b：強、c：長」に集中した。そしてこの2つは、ちょうどサイコロの対角線の両端の頂点のように、どの遺伝的性質についても［　　］の位置にある。この前者がインディカ、後者がジャポニカにあたる。", "source": "（佐藤洋一郎『イネの歴史』、京都大学学術出版会）", "stem": "文中下線の部分「数十」は何についての数か。", "options": {"A": "品種の分類", "B": "遺伝的な性質", "C": "古いイネ品種", "D": "遺伝的性質の組み合わせ"}, "answer": "B", "memo": ""},
{"id": "p104", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）", "passage": "故岡彦一博士はアジアの古いイネ品種を多数集め、それらのうち代表的な百あまりの品種について何十という遺伝的な性質を丹念に調べあげ、百余×数十の大きな表を作り品種の分類を試みた。こういう分析をすると、多くの場合、遺伝的な性質の組み合わせは無数にできて分類は困難を極めそうなものである。しかし、おもしろいことに多くのイネの品種は、それら無数にも近い数の組み合わせのうちのある特定のものに集中した。フェノール反応（a）、塩素酸カリ抵抗性（b）、ふ毛の長さ（c）、という3つの遺伝的性質に注目してみよう。aについてはプラスかマイナス、bについては強いか弱い、cについては長いか短い、のそれぞれ2つのクラスにわけると、遺伝的性質の組み合わせは8つできる。ところがこの8つの組み合わせのうち、圧倒的多数の品種が、「a：プラス、b：弱、c：短」と「a：マイナス、b：強、c：長」に集中した。そしてこの2つは、ちょうどサイコロの対角線の両端の頂点のように、どの遺伝的性質についても［　　］の位置にある。この前者がインディカ、後者がジャポニカにあたる。", "source": "（佐藤洋一郎『イネの歴史』、京都大学学術出版会）", "stem": "文中の空所［　　］に入れることばとして最も適切なものは、つぎのうちどれか。", "options": {"A": "対極", "B": "中間", "C": "同列", "D": "平行"}, "answer": "A", "memo": ""},
{"id": "p105", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "故岡彦一博士はアジアの古いイネ品種を多数集め、それらのうち代表的な百あまりの品種について何十という遺伝的な性質を丹念に調べあげ、百余×数十の大きな表を作り品種の分類を試みた。こういう分析をすると、多くの場合、遺伝的な性質の組み合わせは無数にできて分類は困難を極めそうなものである。しかし、おもしろいことに多くのイネの品種は、それら無数にも近い数の組み合わせのうちのある特定のものに集中した。フェノール反応（a）、塩素酸カリ抵抗性（b）、ふ毛の長さ（c）、という3つの遺伝的性質に注目してみよう。aについてはプラスかマイナス、bについては強いか弱い、cについては長いか短い、のそれぞれ2つのクラスにわけると、遺伝的性質の組み合わせは8つできる。ところがこの8つの組み合わせのうち、圧倒的多数の品種が、「a：プラス、b：弱、c：短」と「a：マイナス、b：強、c：長」に集中した。そしてこの2つは、ちょうどサイコロの対角線の両端の頂点のように、どの遺伝的性質についても［　　］の位置にある。この前者がインディカ、後者がジャポニカにあたる。", "source": "（佐藤洋一郎『イネの歴史』、京都大学学術出版会）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "インディカのフェノール反応はプラスである", "B": "ジャポニカのふ毛の長さは短いクラスに入る", "C": "調べあげたイネの遺伝的性質はわずかだった", "D": "百あまりの古いイネ品種の大半は2つの種類に分類できた"}, "answer": ["A", "D"], "memo": "ジャポニカは「a：マイナス、b：強、c：長」。また遺伝的性質は何十も調べている。"},
{"id": "p106", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "6世紀までの日本の文化は、百済、高句麗、新羅と不可分の関係にあった。当時の中国文化も、ほとんどが朝鮮半島を経由して受容されていた。仏教が百済からもたらされたのは［　　］なことである。", "options": {"A": "画期的", "B": "間接的", "C": "現実的", "D": "効果的", "E": "象徴的", "F": "対照的"}, "answer": "E", "flag": "要確認", "memo": "※PDFでは赤字でBと書かれ、Eが青で塗られています。文脈上「象徴的」が自然なためEを採用しています。"},

{"id": "p109", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "事態を［　　］する", "options": {"A": "遠慮", "B": "苦慮", "C": "思慮", "D": "浅慮", "E": "短慮", "F": "憂慮"}, "answer": "F", "memo": "憂慮＝事態が悪く問題が多いことを心配する。\n苦慮はどう対処するかに苦しむことで、「対応に苦慮する」のように使う。"},

{"id": "p111", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "人情の機微や事の真相などを的確に指摘する", "options": {"A": "あばく", "B": "うがつ", "C": "えぐる", "D": "ただす", "E": "あげつらう"}, "answer": "B", "memo": "あばく＝隠されていることを暴露する。\nえぐる＝深く突き刺すように指摘する。\nあげつらう＝物事の理非や善悪を論じ立てる。"},

{"id": "p116", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "公職につかず民間にいること", "options": {"A": "一般", "B": "在野（ザイヤ）", "C": "私人", "D": "市井（シセイ）", "E": "庶民", "F": "世間"}, "answer": "B", "memo": "在野の対義語は在朝。\n市井＝人と家が集まっているところ、まちなか。"},
{"id": "p117", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "水底をさらって土砂などを取り除くこと", "options": {"A": "掘削", "B": "浚渫（シュンセツ）", "C": "浄化", "D": "治水", "E": "湧（ユウ）出"}, "answer": "B", "memo": "治水＝水害を防ぐこと。"},
{"id": "p118", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "身をもって迫ること", "options": {"A": "緊迫", "B": "進撃", "C": "接近", "D": "肉薄（ニクハク）", "E": "猛追"}, "answer": "D", "memo": "猛追＝激しく追いかけること。"},
{"id": "p119", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "［　　］を得ない説明だ", "options": {"A": "要綱", "B": "要旨", "C": "要所", "D": "要点", "E": "要領"}, "answer": "E", "memo": "要綱＝根本を成す大事な事柄。"},
{"id": "p120", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "市場は活況を［　　］いる", "options": {"A": "高じて", "B": "生じて", "C": "呈して", "D": "観じて", "E": "要して"}, "answer": "C", "memo": "高じる＝ある状態がさらに強くなる。\n呈する＝特定の様子や状態を示す。"},
{"id": "p121", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "出番を待って舞台の袖に<u>ひかえる</u>", "options": {"A": "出発を1週間後に<u>ひかえる</u>", "B": "今は立ち入った話は<u>ひかえる</u>", "C": "この後にすぐ試験が<u>ひかえる</u>", "D": "体調を心配して医師が<u>ひかえる</u>", "E": "将来にそなえて無駄な出費を<u>ひかえる</u>"}, "answer": "D", "memo": "そばで待機するという意味。"},
{"id": "p122", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "評判が<u>落ちる</u>", "options": {"A": "選挙に<u>落ちる</u>", "B": "眠りに<u>落ちる</u>", "C": "汚れが<u>落ちる</u>", "D": "木の葉が<u>落ちる</u>", "E": "スピードが<u>落ちる</u>", "F": "はしごから<u>落ちる</u>"}, "answer": "E", "memo": "程度や水準が低下すること。"},
{"id": "p123", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "後退 ： 進歩<br>　　衰亡 ： （　　）", "options": {"A": "復興", "B": "全盛", "C": "盛況", "D": "興隆（コウリュウ）", "E": "盛大"}, "answer": "D", "memo": "対義語の関係。"},
{"id": "p124", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "辞書 ： 書籍<br>　　障子 ： （　　）", "options": {"A": "桟（サン）", "B": "建具", "C": "和紙", "D": "建築", "E": "ふすま"}, "answer": "B", "memo": "包含関係。辞書は書籍の一種、障子は建具の一種。桟は障子の一部。"},
{"id": "p125", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "ハスやサトイモの葉は、表面に数ミクロンの突起が並んでおり、その先端には葉から分泌された疎水性のワックスがさらに小さな凹凸を形成している。葉の表面が超撥（ハツ）水性をもつのは、このような階層的微細構造とワックス状化合物の［　　］によるものである。", "options": {"A": "化学反応", "B": "自浄作用", "C": "相互作用", "D": "相乗効果", "E": "補完関係", "F": "連鎖反応"}, "answer": "D", "memo": ""},
{"id": "p126", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "［　　］ということには、とても深い意味がある。そうするためには、まず、考えていることを整理しなければならない。思考を整理して書き出すだけで、問題が解決してしまうこともある。そればかりか、自分の目標が具体的に表現され、実現するための第一歩を踏み出すことになる。", "options": {"A": "解決する", "B": "書き出す", "C": "実現する", "D": "整理する", "E": "踏み出す", "F": "目標をもつ"}, "answer": "B", "memo": ""},
{"id": "p127", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "日本の近代文学は［1］［2］［3］［4］［5］さまざまに残存させてきた<br><br>［5］にあてはまるものはつぎのうちどれか。", "options": {"A": "その一方これと", "B": "共存・融合する形で", "C": "土着伝統的な要素をも", "D": "それを軸に発展していったが", "E": "西欧近代の発想の影響を強く受け"}, "answer": "C", "memo": "正しい語順は E→D→A→B→C。"},
{"id": "p128", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "地球が［1］［2］［3］［4］［5］引っ張られているからである<br><br>［1］にあてはまるものはつぎのうちどれか。", "options": {"A": "あらぬ方向に", "B": "太陽の重力に", "C": "太陽の周りを回っても", "D": "飛び去っていかないのは", "E": "秒速30キロメートルという猛スピードで"}, "answer": "E", "memo": "正しい語順は E→C→A→D→B。"},
{"id": "p129", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）あてはまるものをすべて選びなさい。", "passage": "古代ギリシャでは、人間は「運命」に支配されていると考えていた。それは人間を支配する「必然性」であるが、それは何かわけのわからないものであり、「神託」を通して知ることができるが、それから逃れようとしても逃れることのできないものであった。人に降りかかる「偶然」と見えるものは、実は必然的な「運命」なのであると古代ギリシャ人は考えた。ギリシャのみならず古代の人々は、宇宙に秩序が存在することを発見し、したがって必然性がものごとを支配することを認めたが、同時に人間が理解できないことも起こることは認めざるをえなかった。しかしそれを些（サ）細なものとして無視してしまうことができない場合は、それを何か不可解な「必然性」の表れとして、「神意」「因縁」「運命」などと解釈したのであった。それはある意味では［1］を別種の「［2］」と見なすものであり、「［3］」の存在を否定するものであった。純粋の「偶然」、つまり何ら理由なくして発生したり起こったりするものやことの存在を受け入れることは、人間にとって難しいことなのである。", "source": "（竹内啓『偶然とは何か——その積極的意味』、岩波書店）", "stem": "運命について古代ギリシャ人が考えたことは、つぎのうちどれか。", "options": {"A": "人間を支配する必然性である", "B": "宇宙の秩序の些細な乱れである", "C": "神託を通して知ることができる", "D": "逃れることのできないものである"}, "answer": ["A", "C", "D"], "memo": ""},
{"id": "p130", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "古代ギリシャでは、人間は「運命」に支配されていると考えていた。それは人間を支配する「必然性」であるが、それは何かわけのわからないものであり、「神託」を通して知ることができるが、それから逃れようとしても逃れることのできないものであった。人に降りかかる「偶然」と見えるものは、実は必然的な「運命」なのであると古代ギリシャ人は考えた。ギリシャのみならず古代の人々は、宇宙に秩序が存在することを発見し、したがって必然性がものごとを支配することを認めたが、同時に人間が理解できないことも起こることは認めざるをえなかった。しかしそれを些（サ）細なものとして無視してしまうことができない場合は、それを何か不可解な「必然性」の表れとして、「神意」「因縁」「運命」などと解釈したのであった。それはある意味では［1］を別種の「［2］」と見なすものであり、「［3］」の存在を否定するものであった。純粋の「偶然」、つまり何ら理由なくして発生したり起こったりするものやことの存在を受け入れることは、人間にとって難しいことなのである。", "source": "（竹内啓『偶然とは何か——その積極的意味』、岩波書店）", "stem": "古代の人々の考えとして文中で述べられていることは、つぎのうちどれか。", "options": {"A": "宇宙には秩序が存在する", "B": "人間が理解できないものごとは起こらない", "C": "ものごとを支配する必然性はだれにでも理解可能である", "D": "ものごとが理由なく発生したり起こったりすることはない"}, "answer": ["A", "D"], "memo": "人間が理解できないことも起こると認めざるをえなかった、とある。"},
{"id": "p131", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）", "passage": "古代ギリシャでは、人間は「運命」に支配されていると考えていた。それは人間を支配する「必然性」であるが、それは何かわけのわからないものであり、「神託」を通して知ることができるが、それから逃れようとしても逃れることのできないものであった。人に降りかかる「偶然」と見えるものは、実は必然的な「運命」なのであると古代ギリシャ人は考えた。ギリシャのみならず古代の人々は、宇宙に秩序が存在することを発見し、したがって必然性がものごとを支配することを認めたが、同時に人間が理解できないことも起こることは認めざるをえなかった。しかしそれを些（サ）細なものとして無視してしまうことができない場合は、それを何か不可解な「必然性」の表れとして、「神意」「因縁」「運命」などと解釈したのであった。それはある意味では［1］を別種の「［2］」と見なすものであり、「［3］」の存在を否定するものであった。純粋の「偶然」、つまり何ら理由なくして発生したり起こったりするものやことの存在を受け入れることは、人間にとって難しいことなのである。", "source": "（竹内啓『偶然とは何か——その積極的意味』、岩波書店）", "stem": "文中の空所［1］、［2］、［3］に入れることばの組み合わせとして最も適切なものは、つぎのうちどれか。", "options": {"A": "偶然　偶然　必然", "B": "偶然　必然　偶然", "C": "必然　偶然　必然", "D": "必然　必然　偶然"}, "answer": "B", "memo": ""},
{"id": "p132", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "あわてずゆっくりと事を始めるさま", "options": {"A": "ようやく", "B": "おいおいに", "C": "おっとりと", "D": "おもむろに", "E": "じっくりと"}, "answer": "D", "memo": "おいおいに＝追々に、しだいに。\nおっとりと＝落ち着いてゆったりと。\nじっくりと＝時間をかけ念を入れて行うさま。"},
{"id": "p133", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "思い切ってことをするさま", "options": {"A": "敢然（カンゼン）", "B": "毅（キ）然", "C": "強硬", "D": "強引", "E": "断然"}, "answer": "A", "memo": "毅然＝自分の信念を貫くしっかりした態度。\n強硬＝自分の主張を押し通すこと。対義語は軟弱。\n断然＝他と比較にならないほど優れているさま。"},
{"id": "p134", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "当を得たことば", "options": {"A": "金言", "B": "巧言", "C": "至言", "D": "謹言", "E": "格言"}, "answer": "C", "memo": "金言＝価値の高い言葉。\n巧言＝言葉が巧みなこと。\n格言＝短くて含蓄があり、人生の教訓となる言葉。"},
{"id": "p135", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "厳しく区別すること", "options": {"A": "鑑別", "B": "差別", "C": "識別", "D": "峻（シュン）別", "E": "判別", "F": "分別"}, "answer": "D", "memo": "鑑別＝品質や価値を見分ける。\n識別＝物事の違いを見分ける。\n判別＝区別して見分ける。\n分別＝種類や性質ごとに分ける。"},
{"id": "p136", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "すみずみまで詳しく知っていること", "options": {"A": "察知", "B": "知見", "C": "知遇を得る", "D": "通暁（ツウギョウ）", "E": "周知"}, "answer": "D", "memo": "知見＝知識や見解。\n知遇を得る＝人格や能力を認められて厚くもてなされる。\n周知＝広く知れ渡ること。"},
{"id": "p137", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "その気になるようにそそのかす", "options": {"A": "いざなう", "B": "おだてる", "C": "かき立てる", "D": "たき付ける", "E": "持ち掛ける"}, "answer": "D", "memo": "いざなう＝誘う、勧める。\nおだてる＝褒めてその気にさせる。\nかき立てる＝感情や気持ちを強く高める。"},
{"id": "p138", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "世界王座は俺の物だと［　　］", "options": {"A": "吐く", "B": "たたく", "C": "鳴らす", "D": "うそぶく", "E": "吹っ掛ける"}, "answer": "D", "memo": "たたく＝意見や主張を強く訴える。\nうそぶく＝偉そうに大げさなことを言う。\n吹っ掛ける＝法外な値段を言う、けんかをしかける。"},
{"id": "p139", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "双方の［　　］を図る", "options": {"A": "緩和", "B": "混和", "C": "中和", "D": "調和", "E": "飽和", "F": "融和"}, "answer": "F", "memo": "融和＝対立しているものが打ち解けて溶け合うこと。"},
{"id": "p140", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "先生の不興を［　　］", "options": {"A": "仰ぐ", "B": "頂く", "C": "買う", "D": "請う", "E": "引く"}, "answer": "C", "memo": "仰ぐ＝尊敬する、教えなどを求める。\n買う＝ある反応や評価を身に受ける。\n請う＝頼む、願う。"},
{"id": "p141", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "荒れた土地を畑に<u>かえる</u>", "options": {"A": "隣の人と席を<u>かえる</u>", "B": "汚れた水槽の水を<u>かえる</u>", "C": "都合により上演時間を<u>かえる</u>", "D": "服装に合わせて髪型を<u>かえる</u>", "E": "レポートの提出で試験に<u>かえる</u>"}, "answer": "D", "memo": "ある状態や用途を変えること。Eは代わりのものととりかえる意味。"},
{"id": "p142", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "方針が組織の末端まで<u>通る</u>", "options": {"A": "中まで火が<u>通る</u>", "B": "まだ20代で<u>通る</u>", "C": "論文が審査に<u>通る</u>", "D": "新しく地下鉄が<u>通る</u>", "E": "つぎつぎと大型車が<u>通る</u>", "F": "英語はたいていの国で<u>通る</u>"}, "answer": "A", "memo": "すみずみまで行き渡ること。"},
{"id": "p143", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "生命は、物理学的な枠組みの中に自らを従わせつつも、単に、その熱運動に身をゆだねているわけではなく、そこから複雑な秩序を生み出している。その秩序のありようが貝殻を小石から峻（シュン）別しているのだ。しかも生きている貝は、成長に応じてその貝殻の文様をも拡大できる。つまりその秩序は［　　］なものなのだ。", "options": {"A": "知的", "B": "動的", "C": "美的", "D": "法則的", "E": "物理学的"}, "answer": "B", "memo": ""},
{"id": "p144", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "同じ時間でも、［　　］時間のほうが長く感じられる傾向がある。子どもはささいなことも、新鮮に感じ印象に残りやすいが、おとなは多くのことをしても、慣れていると印象に残らない。これも、加齢に伴って時間を速く感じる理由のひとつである。", "options": {"A": "多くのことをした", "B": "何もしないでいた", "C": "印象に残る出来事が多い", "D": "印象に残る出来事が少ない", "E": "大きな刺激に興奮している", "F": "刺激がなくて退屈している"}, "answer": "C", "memo": ""},
{"id": "p145", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "日本では［1］［2］［3］［4］［5］予報のベースとなっている<br><br>［2］にあてはまるものはつぎのうちどれか。", "options": {"A": "現在はコンピュータを用いて", "B": "定量的に表現する量的予報は", "C": "気温や降水量などの気象要素を", "D": "昭和10年代から研究が始まったが", "E": "大気の状態を予測する数値予報が"}, "answer": "B", "memo": "正しい語順は C→B→D→A→E。"},
{"id": "p146", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "経済とは自然を人間にとっての有用物に変換し、それを人間のあいだに分配することにほかならない。自然を人間にとって有用物に変換する行為を、労働と呼んでいる。こうした経済を営むのは、人間が経済人ではなく、知恵のある人だからである。人間以外の生物とちがって、人間だけが自然に存在するものをそのまま消費して欲求を充足するのではなく、自然を人間にとっての有用物に変換していく。自然を人間にとっての有用物に変換するためには、自然の因果関係を明らかにし、それを踏まえて有用物を設計したうえで変換する必要がある。こうしたことが可能になるのは、人間が創造力と構想力をそなえた、知恵のある人だからである。人間の欲求を充足する有用物を増加させるには、自然を有用物に変換する「創造力」や構想力を高めなければならない。しかも、有用物を増加させ、生活水準を上昇させるためには、狭義の［　　］という、自然を有用物に変換させる能力だけでなく、人間どうしの協力や人間のきずなが決定的な要素となる。", "source": "（神野直彦『人間回復の経済学』、岩波書店）", "stem": "文中の空所［　　］に入れることばとして最も適切なものは、つぎのうちどれか。", "options": {"A": "経済", "B": "消費", "C": "設計", "D": "労働"}, "answer": "D", "memo": ""},
{"id": "p147", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "経済とは自然を人間にとっての有用物に変換し、それを人間のあいだに分配することにほかならない。自然を人間にとって有用物に変換する行為を、労働と呼んでいる。こうした経済を営むのは、人間が経済人ではなく、知恵のある人だからである。人間以外の生物とちがって、人間だけが自然に存在するものをそのまま消費して欲求を充足するのではなく、自然を人間にとっての有用物に変換していく。自然を人間にとっての有用物に変換するためには、自然の因果関係を明らかにし、それを踏まえて有用物を設計したうえで変換する必要がある。こうしたことが可能になるのは、人間が創造力と構想力をそなえた、知恵のある人だからである。人間の欲求を充足する有用物を増加させるには、自然を有用物に変換する「創造力」や構想力を高めなければならない。しかも、有用物を増加させ、生活水準を上昇させるためには、狭義の［　　］という、自然を有用物に変換させる能力だけでなく、人間どうしの協力や人間のきずなが決定的な要素となる。", "source": "（神野直彦『人間回復の経済学』、岩波書店）", "stem": "人間にとっての有用物を増加させるのに必要なことは、つぎのうちどれか。", "options": {"A": "協力", "B": "分配", "C": "創造力", "D": "欲求の充足"}, "answer": ["A", "C"], "memo": ""},
{"id": "p148", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "経済とは自然を人間にとっての有用物に変換し、それを人間のあいだに分配することにほかならない。自然を人間にとって有用物に変換する行為を、労働と呼んでいる。こうした経済を営むのは、人間が経済人ではなく、知恵のある人だからである。人間以外の生物とちがって、人間だけが自然に存在するものをそのまま消費して欲求を充足するのではなく、自然を人間にとっての有用物に変換していく。自然を人間にとっての有用物に変換するためには、自然の因果関係を明らかにし、それを踏まえて有用物を設計したうえで変換する必要がある。こうしたことが可能になるのは、人間が創造力と構想力をそなえた、知恵のある人だからである。人間の欲求を充足する有用物を増加させるには、自然を有用物に変換する「創造力」や構想力を高めなければならない。しかも、有用物を増加させ、生活水準を上昇させるためには、狭義の［　　］という、自然を有用物に変換させる能力だけでなく、人間どうしの協力や人間のきずなが決定的な要素となる。", "source": "（神野直彦『人間回復の経済学』、岩波書店）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "自然はそのままでも人間にとって有用である", "B": "自然をそのままでも利用できるのは人間だけである", "C": "生活水準を上げるには人間どうしのきずなが欠かせない", "D": "人間が経済を営むことができるのは知恵のある人だからである"}, "answer": ["C", "D"], "memo": "人間だけが自然をそのまま消費するのではなく有用物に変換する、と述べられている。"},
{"id": "p149", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "へりくだる気持ちがないこと", "options": {"A": "虚勢", "B": "誇示", "C": "自負", "D": "増長", "E": "不遜（フソン）", "F": "慢心"}, "answer": "E", "memo": "増長＝しだいにつけあがること。\n慢心＝心の中で自分のことを自慢すること、おごり高ぶること。"},
{"id": "p150", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "おおげさなこと", "options": {"A": "大柄", "B": "大仰（オオギョウ）", "C": "大事（オオゴト）", "D": "大詰", "E": "大幅"}, "answer": "B", "memo": "大柄＝体や柄が大きいこと。\n大事＝重大なこと、大変なこと。\n大詰＝物事の最後の段階。"},
{"id": "p151", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "他からとびぬけて優れていること", "options": {"A": "傑出", "B": "独走", "C": "優秀", "D": "孤独", "E": "俊敏"}, "answer": "A", "memo": "俊敏＝動作が非常にすばやいこと。"},
{"id": "p152", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "人より前に物事の道理や推移を悟った人", "options": {"A": "開拓者", "B": "革命児", "C": "先覚者", "D": "創始者", "E": "第一人者"}, "answer": "C", "memo": "革命児＝革命を起こして大きな変化をもたらした人。"},
{"id": "p153", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "不愉快な気持ちを表した顔", "options": {"A": "険相（ケンソウ）", "B": "愁顔", "C": "渋面（ジュウメン）", "D": "鉄面皮", "E": "無愛想"}, "answer": "C", "memo": "険相＝険しい表情。\n鉄面皮＝厚かましく恥知らずなこと。\n無愛想＝そっけないさま。"},
{"id": "p154", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "料理のこつを［　　］する", "options": {"A": "会得（エトク）", "B": "合点（ガテン）", "C": "察知", "D": "承知", "E": "得心", "F": "把握"}, "answer": "A", "memo": "会得＝技術や知識などを習得し、自分のものにすること。\n合点・得心＝納得すること。"},
{"id": "p155", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "台風の被害は［　　］だ", "options": {"A": "遠大", "B": "寛大", "C": "極大", "D": "甚大（ジンダイ）", "E": "尊大", "F": "膨大"}, "answer": "D", "memo": "遠大＝計画や構想が非常に広く長期的であること。\n尊大＝偉そうに人を見下した態度。\n膨大＝数量や規模が非常に大きいこと。"},
{"id": "p156", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "この界隈（カイワイ）で幅を［　　］", "options": {"A": "取る", "B": "広げる", "C": "見せる", "D": "利かせる", "E": "もたせる"}, "answer": "D", "memo": "幅を利かせる＝自分の存在を大きく認めさせる、勢力をふるう。"},
{"id": "p157", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "一晩寝れば疲れが<u>とれる</u>", "options": {"A": "1年に米が2回<u>とれる</u>", "B": "左右のバランスが<u>とれる</u>", "C": "社会に出れば角が<u>とれる</u>", "D": "全体として調和が<u>とれる</u>", "E": "その川ではアユが<u>とれる</u>", "F": "表面上は賛成とも<u>とれる</u>"}, "answer": "C", "memo": "好ましくないものが解消して、なくなること。"},
{"id": "p158", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "電話<u>なり</u>手紙なりで知らせる", "options": {"A": "私<u>なり</u>の解釈で話す", "B": "何<u>なり</u>と言いなさい", "C": "すぐ人の言う<u>なり</u>になる", "D": "顔を見る<u>なり</u>叱りつける", "E": "曲がり<u>なり</u>にも店をかまえる"}, "answer": "B", "memo": "複数の選択肢を並べて示す用法。「何でも、どんなことでも」。"},
{"id": "p159", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "電気製品 ： 掃除機<br>　　船舶 ： （　　）", "options": {"A": "港", "B": "船員", "C": "甲板", "D": "船荷", "E": "タンカー"}, "answer": "E", "memo": "包含関係。掃除機は電気製品の一種、タンカーは船舶の一種。"},
{"id": "p160", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "学校 ： 高校<br>　　常緑樹 ： （　　）", "options": {"A": "松", "B": "森林", "C": "樹木", "D": "落葉樹", "E": "いちょう"}, "answer": "A", "memo": "包含関係。松は常緑樹の一種。いちょうは落葉樹。"},
{"id": "p161", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "能や歌舞伎（キ）の「型」に見られる日本の演劇表現は、人間の動作を人形芝居のように［①］することによって、細かい動きや［②］な演技では表現しきれない、象徴化された喜怒哀楽を表現するものである。", "options": {"A": "①解放　②写実的", "B": "①解放　②伝統的", "C": "①限定　②写実的", "D": "①限定　②伝統的", "E": "①増幅　②写実的", "F": "①増幅　②伝統的"}, "answer": "C", "memo": ""},
{"id": "p162", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "ハンムラビ法典には、もし医師が手術に失敗すればその医師の手を切り取ってもよいという条文があった。［①］、古バビロニア王国には［②］がほとんどいなかったといわれており、病人が出ると広場に連れ出し、通行人に治療法を教わっていた。", "options": {"A": "①しかし　②医師", "B": "①しかし　②病人", "C": "①このため　②医師", "D": "①このため　②病人", "E": "①それにもかかわらず　②医師", "F": "①それにもかかわらず　②病人"}, "answer": "C", "memo": "手術に失敗すると罰せられるため、医師のなり手がいなくなったという因果関係。"},
{"id": "p163", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "ジャガイモのふるさとアンデス山脈の［1］［2］［3］［4］［5］作られている<br><br>［1］にあてはまるものはつぎのうちどれか。", "options": {"A": "チューニョと呼ばれる乾燥イモが", "B": "今もジャガイモが盛んに栽培され", "C": "標高4000メートルを超す村々では", "D": "中央に位置するペルーやボリビアの", "E": "気温変化を利用して水分を除去した"}, "answer": "D", "memo": "正しい語順は D→C→B→E→A。"},
{"id": "p164", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "メタンハイドレートは［1］［2］［3］［4］［5］商業化までの道のりは遠い<br><br>［4］にあてはまるものはつぎのうちどれか。", "options": {"A": "広い海域で存在が確認され", "B": "メタンガスと水が結晶化した", "C": "生産試験も始まっているものの", "D": "「燃える氷」といわれるもので", "E": "太平洋側や日本海など日本近海の"}, "answer": "A", "memo": "正しい語順は B→D→E→A→C。"},
{"id": "p165", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "<u>殊勝</u>な心がけの持ち主だ", "options": {"A": "健気（ケナゲ）な", "B": "可憐（レン）な", "C": "優雅な", "D": "利口な", "E": "堅実な", "F": "素直な"}, "answer": "A", "memo": "優雅＝ゆったりして上品なこと。\n堅実＝手堅く危なげがないこと。"},
{"id": "p166", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "立場やよりどころを定めること", "options": {"A": "依拠", "B": "依存", "C": "典拠", "D": "立脚", "E": "立地"}, "answer": "D", "memo": "依拠＝頼りにできる根拠。\n立脚＝物事を考える基礎を置くこと。"},
{"id": "p167", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "以前からの願い", "options": {"A": "切願", "B": "宿願", "C": "懇願", "D": "悲願", "E": "念願"}, "answer": "B", "memo": "切願＝強く熱心に願う。\n懇願＝真心から願う。\n悲願＝どうしても成し遂げようと願う。\n念願＝いつも心にかけて願うこと。"},
{"id": "p168", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "一時しのぎにとりつくろっておくこと", "options": {"A": "虚勢", "B": "見栄（エ）", "C": "糊（コ）塗", "D": "虚飾", "E": "上塗り"}, "answer": "C", "memo": "上塗り＝表面を覆って隠す。また、事態をさらに悪化させること。"},
{"id": "p169", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "世俗的な物事にこだわらないさま", "options": {"A": "粛然", "B": "整然", "C": "泰然", "D": "超然", "E": "冷然"}, "answer": "D", "memo": "粛然＝つつしんでかしこまるさま。\n泰然＝落ち着いていて動じないさま。"},
{"id": "p170", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "好ましくないとして拒み退けること", "options": {"A": "遺棄", "B": "邪険", "C": "敬遠", "D": "疎外", "E": "排斥"}, "answer": "E", "memo": "邪険＝無慈悲で冷たいこと。\n敬遠＝表面は敬うように見せかけて実際は避けること。"},
{"id": "p171", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "彼の芸はまさに［　　］期を迎えていますね", "options": {"A": "円熟", "B": "熟成", "C": "熟達", "D": "成育", "E": "成熟"}, "answer": "A", "memo": "円熟＝経験を積んで技術や表現が豊かになっていること。\n成熟＝十分に成長し発達していること。"},
{"id": "p172", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "事態の［　　］を見守る", "options": {"A": "移行", "B": "急変", "C": "推移", "D": "転換", "E": "変遷", "F": "流転"}, "answer": "C", "memo": "変遷や転換は長期的な変化に使う。"},
{"id": "p173", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "一笑に［　　］", "options": {"A": "誘う", "B": "処す", "C": "流す", "D": "付す", "E": "飛ばす", "F": "あしらう"}, "answer": "D", "memo": "一笑に付す＝つまらないものとして笑い飛ばすこと。\nあしらう＝いいかげんに扱う。"},
{"id": "p174", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "<u>のぞむ</u>ところだ", "options": {"A": "海に<u>のぞむ</u>家", "B": "別れの場に<u>のぞむ</u>", "C": "落ち着いて交渉に<u>のぞむ</u>", "D": "自立心を子どもに<u>のぞむ</u>", "E": "来賓として式場に<u>のぞむ</u>", "F": "試合に一丸となって<u>のぞむ</u>"}, "answer": "D", "memo": "期待する、望むという意味。"},
{"id": "p175", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "感覚 ： 味覚<br>　　書籍 ： （　　）", "options": {"A": "文芸", "B": "図書", "C": "聖書", "D": "出版", "E": "読書"}, "answer": "C", "memo": "包含関係。味覚は感覚の一種、聖書は書籍の一種。"},
{"id": "p176", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "すべてが流動し選択化している今日、［　　］は不安定性の増大と表裏一体である。個人は束縛から解放され自由に移動できることを喜びつつも、どこにおのれの居場所があるのか必死に探している。", "options": {"A": "個人の自律性", "B": "組織への従属", "C": "他者との関係", "D": "家族関係の希薄化", "E": "自由と選択の拡大", "F": "適切な対処法の発見"}, "answer": "E", "memo": ""},
{"id": "p177", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "「カエルが鳴くと雨」や「朝焼けは雨」といった天気に関することわざは数多くあるが、いずれもある地点での空模様の観察の積み重ねから得られた［①］に関する［②］であるといえる。", "options": {"A": "①自然の観察　②確率論", "B": "①自然の観察　②経験則", "C": "①地域の特性　②確率論", "D": "①地域の特性　②経験則", "E": "①天気の変化　②確率論", "F": "①天気の変化　②経験則"}, "answer": "F", "memo": ""},
{"id": "p178", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "無作為に対象者を選ぶ［1］［2］［3］［4］［5］傾向がある<br><br>［2］にあてはまるものはつぎのうちどれか。", "options": {"A": "より極端な結果が出る", "B": "世論調査と比較すると", "C": "インターネット調査の場合は", "D": "特定のテーマに関心をもって", "E": "サイトを閲覧した人が回答する"}, "answer": "C", "memo": "正しい語順は B→C→D→E→A。"},
{"id": "p179", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "法律の制定のためには［1］［2］［3］［4］［5］設定されていなくてはならない<br><br>［3］にあてはまるものはつぎのうちどれか。", "options": {"A": "抜かりなく見通され", "B": "処罰の仕方があらかじめ", "C": "社会生活において起こりうる", "D": "その成り行きに対する対応が", "E": "さまざまの場合を周到に見て取り"}, "answer": "D", "memo": "正しい語順は C→E→D→A→B。"},
{"id": "p180", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "賢者の言葉を紹介した本が出版される中、巷（チマタ）でよく聞かれるのが、「ゲーテは今から200年も前の人なのにこんなにすごいことを言っていたのか。驚きました」といった類（タグ）いの反応だ。これは近代＝進歩史観に完全に毒された考え方である。すなわち、時間の経過とともに人間精神が進化するという妄想だ。かつては「昔の人［　　］すごい」という感慨はあっても「昔の人なのにすごい」という感覚はなかった。偉大な過去に驚異を感じ、畏（イ）敬の念を抱き、古典の模倣を繰り返すことにより文明は維持されてきたからだ。過去は単純に美化されたのではなく、常に現在との緊張関係において捉（トラ）えられていた。ところが近代において進歩史観が勝利を占め、歴史は学問の対象に、古典は教養の枠に閉じ込められた。大衆社会において、ついに歴史は趣味になる。現代人の趣味に合わないものは「昔の人の価値観だから」と否定されるようになった。大衆は自分たちが文化の最前線にいると思い込むようになり、古典的な規範を認めず、視線を未来にだけ向けるようになった。", "source": "（適菜収「賢者に学ぶ」『産経新聞』、2012年6月8日）", "stem": "文中の空所［　　］に入れることばとして最も適切なものは、つぎのうちどれか。", "options": {"A": "でも", "B": "だから", "C": "なりに", "D": "としては"}, "answer": "B", "flag": "要確認", "memo": "「昔の人なのにすごい」（進歩史観）と対比される、過去を偉大とみる態度。\n※PDFでは「B or C ?」と迷った跡があり、Cが選択されています。文脈からBを採用しています。"},
{"id": "p181", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "賢者の言葉を紹介した本が出版される中、巷（チマタ）でよく聞かれるのが、「ゲーテは今から200年も前の人なのにこんなにすごいことを言っていたのか。驚きました」といった類（タグ）いの反応だ。これは近代＝進歩史観に完全に毒された考え方である。すなわち、時間の経過とともに人間精神が進化するという妄想だ。かつては「昔の人［　　］すごい」という感慨はあっても「昔の人なのにすごい」という感覚はなかった。偉大な過去に驚異を感じ、畏（イ）敬の念を抱き、古典の模倣を繰り返すことにより文明は維持されてきたからだ。過去は単純に美化されたのではなく、常に現在との緊張関係において捉（トラ）えられていた。ところが近代において進歩史観が勝利を占め、歴史は学問の対象に、古典は教養の枠に閉じ込められた。大衆社会において、ついに歴史は趣味になる。現代人の趣味に合わないものは「昔の人の価値観だから」と否定されるようになった。大衆は自分たちが文化の最前線にいると思い込むようになり、古典的な規範を認めず、視線を未来にだけ向けるようになった。", "source": "（適菜収「賢者に学ぶ」『産経新聞』、2012年6月8日）", "stem": "文中下線の部分「考え方」にあてはまることは、つぎのうちどれか。", "options": {"A": "過去を単純に美化する", "B": "歴史は学問の対象にすぎない", "C": "文化の最前線にいるのは現代人である", "D": "人間精神は時間の経過とともに進化する"}, "answer": ["B", "C", "D"], "memo": "過去は単純に美化されたのではない、と述べられている。"},
{"id": "p182", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "賢者の言葉を紹介した本が出版される中、巷（チマタ）でよく聞かれるのが、「ゲーテは今から200年も前の人なのにこんなにすごいことを言っていたのか。驚きました」といった類（タグ）いの反応だ。これは近代＝進歩史観に完全に毒された考え方である。すなわち、時間の経過とともに人間精神が進化するという妄想だ。かつては「昔の人［　　］すごい」という感慨はあっても「昔の人なのにすごい」という感覚はなかった。偉大な過去に驚異を感じ、畏（イ）敬の念を抱き、古典の模倣を繰り返すことにより文明は維持されてきたからだ。過去は単純に美化されたのではなく、常に現在との緊張関係において捉（トラ）えられていた。ところが近代において進歩史観が勝利を占め、歴史は学問の対象に、古典は教養の枠に閉じ込められた。大衆社会において、ついに歴史は趣味になる。現代人の趣味に合わないものは「昔の人の価値観だから」と否定されるようになった。大衆は自分たちが文化の最前線にいると思い込むようになり、古典的な規範を認めず、視線を未来にだけ向けるようになった。", "source": "（適菜収「賢者に学ぶ」『産経新聞』、2012年6月8日）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "かつて過去は現在との緊張関係において捉えられていた", "B": "古典の模倣を繰り返さずに視線を未来に向けるべきである", "C": "進歩史観によって昔の人の価値観は否定されるようになった", "D": "文明は偉大な過去に驚異を感じ模倣することで維持されてきた"}, "answer": ["A", "C", "D"], "memo": "Bは筆者が批判している態度。"},
{"id": "p183", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "心のもち方がしっかりしていること", "options": {"A": "頑健", "B": "気丈", "C": "強靭（キョウジン）", "D": "豪胆（ゴウタン）", "E": "骨太"}, "answer": "B", "memo": "頑健＝体が丈夫で健康なこと。\n豪胆＝危険に臨んでも大胆に処理すること。"},
{"id": "p184", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "おごそかで重々しく感動的なさま", "options": {"A": "豪壮", "B": "重厚", "C": "粛然", "D": "神聖", "E": "荘厳（ソウゴン）"}, "answer": "E", "memo": "豪壮＝物事の規模が大きく立派なこと。"},
{"id": "p185", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "欠点、悪習などを正しい状態になおすこと", "options": {"A": "修整", "B": "修正", "C": "矯正", "D": "整形", "E": "鍛錬"}, "answer": "C", "memo": "修整＝見た目や形を整えること。\n修正＝誤りや不備を正しく直すこと。"},
{"id": "p186", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "巧みでないこと", "options": {"A": "つたない", "B": "ぎこちない", "C": "たわいない", "D": "ふがいない", "E": "おぼつかない"}, "answer": "A", "memo": "ぎこちない＝動作が固くて不自然。\nたわいない＝取るに足りない、しっかりしたところがない。\nふがいない＝情けない、意気地がない。\nおぼつかない＝たよりない、心もとない。"},
{"id": "p187", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "ことばがつかえるような下手なしゃべり方", "options": {"A": "寡言（カゲン）", "B": "減らず口", "C": "絶句", "D": "訥弁（トツベン）", "E": "饒舌（ジョウゼツ）"}, "answer": "D", "memo": "寡言＝口数が少ないこと。\n絶句＝話が途中で詰まること。\n訥弁の対義語は能弁。\n饒舌＝むやみにしゃべり散らすこと。"},
{"id": "p188", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "ある状態に固定して進展しないこと", "options": {"A": "膠（コウ）着", "B": "停滞", "C": "凍結", "D": "頓挫（トンザ）", "E": "保留"}, "answer": "A", "memo": "頓挫＝物事の進行が急にくじけること。"},
{"id": "p189", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "ねらいを定めること", "options": {"A": "目星（メボシ）", "B": "目標", "C": "標的", "D": "見当", "E": "照準"}, "answer": "E", "memo": "目星＝目当て、こうだろうという見込み。"},
{"id": "p190", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "生活をしていくための仕事", "options": {"A": "請負い", "B": "肩書き", "C": "食いぶち", "D": "なりわい", "E": "やりくり"}, "answer": "D", "memo": "食いぶち＝食べるための費用。\nやりくり＝あれこれ操作して都合をつけること。"},
{"id": "p191", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "必要な物事を十分に備えていること", "options": {"A": "具備", "B": "常備", "C": "整備", "D": "装備", "E": "配備"}, "answer": "A", "memo": ""},
{"id": "p192", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "［　　］を緩和する", "options": {"A": "関係", "B": "交通", "C": "興奮", "D": "混雑", "E": "性格", "F": "暴風"}, "answer": "D", "memo": ""},
{"id": "p193", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "パートナー同伴が［　　］だ", "options": {"A": "慣例", "B": "恒例", "C": "実例", "D": "定例", "E": "範例", "F": "類例"}, "answer": "A", "memo": "恒例は儀式や行事、イベントについて使う。"},
{"id": "p194", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "責任の所在を［　　］にする", "options": {"A": "あやふや", "B": "うやむや", "C": "おぼろげ", "D": "でたらめ", "E": "いいかげん", "F": "どっちつかず"}, "answer": "B", "memo": "あやふや＝記憶や説明が不確かなこと。\nうやむや＝物事をはっきりさせずに放置すること。\nおぼろげ＝ぼんやりして不明瞭。\nでたらめ＝筋が通らないこと。"},
{"id": "p195", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "一朝<u>こと</u>あるとき", "options": {"A": "静かに食べる<u>こと</u>", "B": "食べた<u>こと</u>がない", "C": "正しい<u>こと</u>を言う", "D": "事件の<u>こと</u>は秘密だ", "E": "彼は<u>こと</u>を好む性格だ"}, "answer": "D", "memo": "特定の事件や出来事を指す用法。「何か重大なことが起こったとき」。"},
{"id": "p196", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "再会の誓いで文を<u>むすぶ</u>", "options": {"A": "助詞で主語と述語を<u>むすぶ</u>", "B": "巧みな話術で協定を<u>むすぶ</u>", "C": "怒りで真一文字に口を<u>むすぶ</u>", "D": "部長のことばで歓迎会を<u>むすぶ</u>", "E": "インターネットで世界中を<u>むすぶ</u>"}, "answer": "D", "memo": "終わりにする、締めくくるという意味。"},
{"id": "p197", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "通信機 ： 通信<br>　　ミット ： （　　）", "options": {"A": "捕球", "B": "捕手", "C": "投球", "D": "ボール", "E": "グローブ"}, "answer": "A", "memo": "用途の関係。"},

{"id": "p199", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "日本語には同音類義語が多く、たとえば、「たいせい」には「態勢」と「体制」の類義語がある。「態勢」は［①］な状態であり、何かのためにその場で作られた態度であり、動的である。「体制」は［②］な組織または制度を指す場合に使われ、どちらかといえば静的である。", "options": {"A": "①一時的　②持続的", "B": "①一時的　②断続的", "C": "①持続的　②一時的", "D": "①持続的　②断続的", "E": "①断続的　②一時的", "F": "①断続的　②持続的"}, "answer": "A", "memo": ""},

{"id": "p203", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "利根川の源流はどこだろうか。その答えを探すため、明治27年（1894）9月に最初の利根川源流探しの探検が行われたが失敗した。その後も、いくつかの探検隊が試みたがことごとく失敗に終わり、源流が確定したのは昭和29年（1954）8月であった。成否を分けた理由は種々あるが、一つには詳細な地図がなかったからだと思われる。現地にあるいずれの谷が主流なのかが、当時まだ不明だった。そのため暗中模索の源流探しだった。<br>　川について、図式と呼ばれる地図に関する規則では「河川は、平水時の水流の幅が1.5メートル以上のものを表示する」とある。源流は、ごく小さな流れから始まる例が多い。地図上の川の始まりが実際の源流地点と一致するのは極めて稀（マレ）であり、源流地点はおおむね地図に表示された川の、もっと先にある。ちなみに、利根川の源流付近には、昭和63年（1988）に当時の建設省などによって建てられた「利根川水源碑」が尾根筋にあって、その直下の水流が源流地点である。", "source": "（山岡光治『地図に訊け！』、筑摩書房）", "stem": "利根川の源流が確定できなかった理由として文中で述べられていることは、つぎのうちどれか。", "options": {"A": "源流を探す知識がなかった", "B": "主流がそのときどきで変わった", "C": "河川の定義ができていなかった", "D": "どの谷が主流かわかっていなかった"}, "answer": "D", "memo": ""},
