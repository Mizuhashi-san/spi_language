{"id": "p125", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "ハスやサトイモの葉は、表面に数ミクロンの突起が並んでおり、その先端には葉から分泌された疎水性のワックスがさらに小さな凹凸を形成している。葉の表面が超撥（ハツ）水性をもつのは、このような階層的微細構造とワックス状化合物の［　　］によるものである。", "options": {"A": "化学反応", "B": "自浄作用", "C": "相互作用", "D": "相乗効果", "E": "補完関係", "F": "連鎖反応"}, "answer": "D", "memo": "", "subject": "lang", "group": "p125"},
{"id": "p126", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "［　　］ということには、とても深い意味がある。そうするためには、まず、考えていることを整理しなければならない。思考を整理して書き出すだけで、問題が解決してしまうこともある。そればかりか、自分の目標が具体的に表現され、実現するための第一歩を踏み出すことになる。", "options": {"A": "解決する", "B": "書き出す", "C": "実現する", "D": "整理する", "E": "踏み出す", "F": "目標をもつ"}, "answer": "B", "memo": "", "subject": "lang", "group": "p126"},
{"id": "p127", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "日本の近代文学は［1］［2］［3］［4］［5］さまざまに残存させてきた<br><br>［5］にあてはまるものはつぎのうちどれか。", "options": {"A": "その一方これと", "B": "共存・融合する形で", "C": "土着伝統的な要素をも", "D": "それを軸に発展していったが", "E": "西欧近代の発想の影響を強く受け"}, "answer": "C", "memo": "正しい語順は E→D→A→B→C。", "subject": "lang", "group": "p127"},
{"id": "p128", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "地球が［1］［2］［3］［4］［5］引っ張られているからである<br><br>［1］にあてはまるものはつぎのうちどれか。", "options": {"A": "あらぬ方向に", "B": "太陽の重力に", "C": "太陽の周りを回っても", "D": "飛び去っていかないのは", "E": "秒速30キロメートルという猛スピードで"}, "answer": "E", "memo": "正しい語順は E→C→A→D→B。", "subject": "lang", "group": "p128"},
{"id": "p129", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）あてはまるものをすべて選びなさい。", "passage": "古代ギリシャでは、人間は「運命」に支配されていると考えていた。それは人間を支配する「必然性」であるが、それは何かわけのわからないものであり、「神託」を通して知ることができるが、それから逃れようとしても逃れることのできないものであった。人に降りかかる「偶然」と見えるものは、実は必然的な「運命」なのであると古代ギリシャ人は考えた。ギリシャのみならず古代の人々は、宇宙に秩序が存在することを発見し、したがって必然性がものごとを支配することを認めたが、同時に人間が理解できないことも起こることは認めざるをえなかった。しかしそれを些（サ）細なものとして無視してしまうことができない場合は、それを何か不可解な「必然性」の表れとして、「神意」「因縁」「運命」などと解釈したのであった。それはある意味では［1］を別種の「［2］」と見なすものであり、「［3］」の存在を否定するものであった。純粋の「偶然」、つまり何ら理由なくして発生したり起こったりするものやことの存在を受け入れることは、人間にとって難しいことなのである。", "source": "（竹内啓『偶然とは何か——その積極的意味』、岩波書店）", "stem": "運命について古代ギリシャ人が考えたことは、つぎのうちどれか。", "options": {"A": "人間を支配する必然性である", "B": "宇宙の秩序の些細な乱れである", "C": "神託を通して知ることができる", "D": "逃れることのできないものである"}, "answer": ["A", "C", "D"], "memo": "", "subject": "lang", "group": "p129"},
{"id": "p130", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "古代ギリシャでは、人間は「運命」に支配されていると考えていた。それは人間を支配する「必然性」であるが、それは何かわけのわからないものであり、「神託」を通して知ることができるが、それから逃れようとしても逃れることのできないものであった。人に降りかかる「偶然」と見えるものは、実は必然的な「運命」なのであると古代ギリシャ人は考えた。ギリシャのみならず古代の人々は、宇宙に秩序が存在することを発見し、したがって必然性がものごとを支配することを認めたが、同時に人間が理解できないことも起こることは認めざるをえなかった。しかしそれを些（サ）細なものとして無視してしまうことができない場合は、それを何か不可解な「必然性」の表れとして、「神意」「因縁」「運命」などと解釈したのであった。それはある意味では［1］を別種の「［2］」と見なすものであり、「［3］」の存在を否定するものであった。純粋の「偶然」、つまり何ら理由なくして発生したり起こったりするものやことの存在を受け入れることは、人間にとって難しいことなのである。", "source": "（竹内啓『偶然とは何か——その積極的意味』、岩波書店）", "stem": "古代の人々の考えとして文中で述べられていることは、つぎのうちどれか。", "options": {"A": "宇宙には秩序が存在する", "B": "人間が理解できないものごとは起こらない", "C": "ものごとを支配する必然性はだれにでも理解可能である", "D": "ものごとが理由なく発生したり起こったりすることはない"}, "answer": ["A", "D"], "memo": "人間が理解できないことも起こると認めざるをえなかった、とある。", "subject": "lang", "group": "p130"},
{"id": "p131", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）", "passage": "古代ギリシャでは、人間は「運命」に支配されていると考えていた。それは人間を支配する「必然性」であるが、それは何かわけのわからないものであり、「神託」を通して知ることができるが、それから逃れようとしても逃れることのできないものであった。人に降りかかる「偶然」と見えるものは、実は必然的な「運命」なのであると古代ギリシャ人は考えた。ギリシャのみならず古代の人々は、宇宙に秩序が存在することを発見し、したがって必然性がものごとを支配することを認めたが、同時に人間が理解できないことも起こることは認めざるをえなかった。しかしそれを些（サ）細なものとして無視してしまうことができない場合は、それを何か不可解な「必然性」の表れとして、「神意」「因縁」「運命」などと解釈したのであった。それはある意味では［1］を別種の「［2］」と見なすものであり、「［3］」の存在を否定するものであった。純粋の「偶然」、つまり何ら理由なくして発生したり起こったりするものやことの存在を受け入れることは、人間にとって難しいことなのである。", "source": "（竹内啓『偶然とは何か——その積極的意味』、岩波書店）", "stem": "文中の空所［1］、［2］、［3］に入れることばの組み合わせとして最も適切なものは、つぎのうちどれか。", "options": {"A": "偶然　偶然　必然", "B": "偶然　必然　偶然", "C": "必然　偶然　必然", "D": "必然　必然　偶然"}, "answer": "B", "memo": "", "subject": "lang", "group": "p131"},
{"id": "p132", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "あわてずゆっくりと事を始めるさま", "options": {"A": "ようやく", "B": "おいおいに", "C": "おっとりと", "D": "おもむろに", "E": "じっくりと"}, "answer": "D", "memo": "おいおいに＝追々に、しだいに。\nおっとりと＝落ち着いてゆったりと。\nじっくりと＝時間をかけ念を入れて行うさま。", "subject": "lang", "group": "p132"},
{"id": "p133", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "思い切ってことをするさま", "options": {"A": "敢然（カンゼン）", "B": "毅（キ）然", "C": "強硬", "D": "強引", "E": "断然"}, "answer": "A", "memo": "毅然＝自分の信念を貫くしっかりした態度。\n強硬＝自分の主張を押し通すこと。対義語は軟弱。\n断然＝他と比較にならないほど優れているさま。", "subject": "lang", "group": "p133"},
{"id": "p134", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "当を得たことば", "options": {"A": "金言", "B": "巧言", "C": "至言", "D": "謹言", "E": "格言"}, "answer": "C", "memo": "金言＝価値の高い言葉。\n巧言＝言葉が巧みなこと。\n格言＝短くて含蓄があり、人生の教訓となる言葉。", "subject": "lang", "group": "p134"},
{"id": "p135", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "厳しく区別すること", "options": {"A": "鑑別", "B": "差別", "C": "識別", "D": "峻（シュン）別", "E": "判別", "F": "分別"}, "answer": "D", "memo": "鑑別＝品質や価値を見分ける。\n識別＝物事の違いを見分ける。\n判別＝区別して見分ける。\n分別＝種類や性質ごとに分ける。", "subject": "lang", "group": "p135"},
{"id": "p136", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "すみずみまで詳しく知っていること", "options": {"A": "察知", "B": "知見", "C": "知遇を得る", "D": "通暁（ツウギョウ）", "E": "周知"}, "answer": "D", "memo": "知見＝知識や見解。\n知遇を得る＝人格や能力を認められて厚くもてなされる。\n周知＝広く知れ渡ること。", "subject": "lang", "group": "p136"},
{"id": "p137", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "その気になるようにそそのかす", "options": {"A": "いざなう", "B": "おだてる", "C": "かき立てる", "D": "たき付ける", "E": "持ち掛ける"}, "answer": "D", "memo": "いざなう＝誘う、勧める。\nおだてる＝褒めてその気にさせる。\nかき立てる＝感情や気持ちを強く高める。", "subject": "lang", "group": "p137"},
{"id": "p138", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "世界王座は俺の物だと［　　］", "options": {"A": "吐く", "B": "たたく", "C": "鳴らす", "D": "うそぶく", "E": "吹っ掛ける"}, "answer": "D", "memo": "たたく＝意見や主張を強く訴える。\nうそぶく＝偉そうに大げさなことを言う。\n吹っ掛ける＝法外な値段を言う、けんかをしかける。", "subject": "lang", "group": "p138"},
{"id": "p139", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "双方の［　　］を図る", "options": {"A": "緩和", "B": "混和", "C": "中和", "D": "調和", "E": "飽和", "F": "融和"}, "answer": "F", "memo": "融和＝対立しているものが打ち解けて溶け合うこと。", "subject": "lang", "group": "p139"},
{"id": "p140", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "先生の不興を［　　］", "options": {"A": "仰ぐ", "B": "頂く", "C": "買う", "D": "請う", "E": "引く"}, "answer": "C", "memo": "仰ぐ＝尊敬する、教えなどを求める。\n買う＝ある反応や評価を身に受ける。\n請う＝頼む、願う。", "subject": "lang", "group": "p140"},
{"id": "p141", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "荒れた土地を畑に<u>かえる</u>", "options": {"A": "隣の人と席を<u>かえる</u>", "B": "汚れた水槽の水を<u>かえる</u>", "C": "都合により上演時間を<u>かえる</u>", "D": "服装に合わせて髪型を<u>かえる</u>", "E": "レポートの提出で試験に<u>かえる</u>"}, "answer": "D", "memo": "ある状態や用途を変えること。Eは代わりのものととりかえる意味。", "subject": "lang", "group": "p141"},
{"id": "p142", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "方針が組織の末端まで<u>通る</u>", "options": {"A": "中まで火が<u>通る</u>", "B": "まだ20代で<u>通る</u>", "C": "論文が審査に<u>通る</u>", "D": "新しく地下鉄が<u>通る</u>", "E": "つぎつぎと大型車が<u>通る</u>", "F": "英語はたいていの国で<u>通る</u>"}, "answer": "A", "memo": "すみずみまで行き渡ること。", "subject": "lang", "group": "p142"},
{"id": "p143", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "生命は、物理学的な枠組みの中に自らを従わせつつも、単に、その熱運動に身をゆだねているわけではなく、そこから複雑な秩序を生み出している。その秩序のありようが貝殻を小石から峻（シュン）別しているのだ。しかも生きている貝は、成長に応じてその貝殻の文様をも拡大できる。つまりその秩序は［　　］なものなのだ。", "options": {"A": "知的", "B": "動的", "C": "美的", "D": "法則的", "E": "物理学的"}, "answer": "B", "memo": "", "subject": "lang", "group": "p143"},
{"id": "p144", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "同じ時間でも、［　　］時間のほうが長く感じられる傾向がある。子どもはささいなことも、新鮮に感じ印象に残りやすいが、おとなは多くのことをしても、慣れていると印象に残らない。これも、加齢に伴って時間を速く感じる理由のひとつである。", "options": {"A": "多くのことをした", "B": "何もしないでいた", "C": "印象に残る出来事が多い", "D": "印象に残る出来事が少ない", "E": "大きな刺激に興奮している", "F": "刺激がなくて退屈している"}, "answer": "C", "memo": "", "subject": "lang", "group": "p144"},
{"id": "p145", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "日本では［1］［2］［3］［4］［5］予報のベースとなっている<br><br>［2］にあてはまるものはつぎのうちどれか。", "options": {"A": "現在はコンピュータを用いて", "B": "定量的に表現する量的予報は", "C": "気温や降水量などの気象要素を", "D": "昭和10年代から研究が始まったが", "E": "大気の状態を予測する数値予報が"}, "answer": "B", "memo": "正しい語順は C→B→D→A→E。", "subject": "lang", "group": "p145"},
{"id": "p146", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "経済とは自然を人間にとっての有用物に変換し、それを人間のあいだに分配することにほかならない。自然を人間にとって有用物に変換する行為を、労働と呼んでいる。こうした経済を営むのは、人間が経済人ではなく、知恵のある人だからである。人間以外の生物とちがって、人間だけが自然に存在するものをそのまま消費して欲求を充足するのではなく、自然を人間にとっての有用物に変換していく。自然を人間にとっての有用物に変換するためには、自然の因果関係を明らかにし、それを踏まえて有用物を設計したうえで変換する必要がある。こうしたことが可能になるのは、人間が創造力と構想力をそなえた、知恵のある人だからである。人間の欲求を充足する有用物を増加させるには、自然を有用物に変換する「創造力」や構想力を高めなければならない。しかも、有用物を増加させ、生活水準を上昇させるためには、狭義の［　　］という、自然を有用物に変換させる能力だけでなく、人間どうしの協力や人間のきずなが決定的な要素となる。", "source": "（神野直彦『人間回復の経済学』、岩波書店）", "stem": "文中の空所［　　］に入れることばとして最も適切なものは、つぎのうちどれか。", "options": {"A": "経済", "B": "消費", "C": "設計", "D": "労働"}, "answer": "D", "memo": "", "subject": "lang", "group": "p146"},
{"id": "p147", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "経済とは自然を人間にとっての有用物に変換し、それを人間のあいだに分配することにほかならない。自然を人間にとって有用物に変換する行為を、労働と呼んでいる。こうした経済を営むのは、人間が経済人ではなく、知恵のある人だからである。人間以外の生物とちがって、人間だけが自然に存在するものをそのまま消費して欲求を充足するのではなく、自然を人間にとっての有用物に変換していく。自然を人間にとっての有用物に変換するためには、自然の因果関係を明らかにし、それを踏まえて有用物を設計したうえで変換する必要がある。こうしたことが可能になるのは、人間が創造力と構想力をそなえた、知恵のある人だからである。人間の欲求を充足する有用物を増加させるには、自然を有用物に変換する「創造力」や構想力を高めなければならない。しかも、有用物を増加させ、生活水準を上昇させるためには、狭義の［　　］という、自然を有用物に変換させる能力だけでなく、人間どうしの協力や人間のきずなが決定的な要素となる。", "source": "（神野直彦『人間回復の経済学』、岩波書店）", "stem": "人間にとっての有用物を増加させるのに必要なことは、つぎのうちどれか。", "options": {"A": "協力", "B": "分配", "C": "創造力", "D": "欲求の充足"}, "answer": ["A", "C"], "memo": "", "subject": "lang", "group": "p147"},
{"id": "p148", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "経済とは自然を人間にとっての有用物に変換し、それを人間のあいだに分配することにほかならない。自然を人間にとって有用物に変換する行為を、労働と呼んでいる。こうした経済を営むのは、人間が経済人ではなく、知恵のある人だからである。人間以外の生物とちがって、人間だけが自然に存在するものをそのまま消費して欲求を充足するのではなく、自然を人間にとっての有用物に変換していく。自然を人間にとっての有用物に変換するためには、自然の因果関係を明らかにし、それを踏まえて有用物を設計したうえで変換する必要がある。こうしたことが可能になるのは、人間が創造力と構想力をそなえた、知恵のある人だからである。人間の欲求を充足する有用物を増加させるには、自然を有用物に変換する「創造力」や構想力を高めなければならない。しかも、有用物を増加させ、生活水準を上昇させるためには、狭義の［　　］という、自然を有用物に変換させる能力だけでなく、人間どうしの協力や人間のきずなが決定的な要素となる。", "source": "（神野直彦『人間回復の経済学』、岩波書店）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "自然はそのままでも人間にとって有用である", "B": "自然をそのままでも利用できるのは人間だけである", "C": "生活水準を上げるには人間どうしのきずなが欠かせない", "D": "人間が経済を営むことができるのは知恵のある人だからである"}, "answer": ["C", "D"], "memo": "人間だけが自然をそのまま消費するのではなく有用物に変換する、と述べられている。", "subject": "lang", "group": "p148"},
{"id": "p149", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "へりくだる気持ちがないこと", "options": {"A": "虚勢", "B": "誇示", "C": "自負", "D": "増長", "E": "不遜（フソン）", "F": "慢心"}, "answer": "E", "memo": "増長＝しだいにつけあがること。\n慢心＝心の中で自分のことを自慢すること、おごり高ぶること。", "subject": "lang", "group": "p149"},
{"id": "p150", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "おおげさなこと", "options": {"A": "大柄", "B": "大仰（オオギョウ）", "C": "大事（オオゴト）", "D": "大詰", "E": "大幅"}, "answer": "B", "memo": "大柄＝体や柄が大きいこと。\n大事＝重大なこと、大変なこと。\n大詰＝物事の最後の段階。", "subject": "lang", "group": "p150"},
{"id": "p151", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "他からとびぬけて優れていること", "options": {"A": "傑出", "B": "独走", "C": "優秀", "D": "孤独", "E": "俊敏"}, "answer": "A", "memo": "俊敏＝動作が非常にすばやいこと。", "subject": "lang", "group": "p151"},
{"id": "p152", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "人より前に物事の道理や推移を悟った人", "options": {"A": "開拓者", "B": "革命児", "C": "先覚者", "D": "創始者", "E": "第一人者"}, "answer": "C", "memo": "革命児＝革命を起こして大きな変化をもたらした人。", "subject": "lang", "group": "p152"},
{"id": "p153", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "不愉快な気持ちを表した顔", "options": {"A": "険相（ケンソウ）", "B": "愁顔", "C": "渋面（ジュウメン）", "D": "鉄面皮", "E": "無愛想"}, "answer": "C", "memo": "険相＝険しい表情。\n鉄面皮＝厚かましく恥知らずなこと。\n無愛想＝そっけないさま。", "subject": "lang", "group": "p153"},
{"id": "p154", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "料理のこつを［　　］する", "options": {"A": "会得（エトク）", "B": "合点（ガテン）", "C": "察知", "D": "承知", "E": "得心", "F": "把握"}, "answer": "A", "memo": "会得＝技術や知識などを習得し、自分のものにすること。\n合点・得心＝納得すること。", "subject": "lang", "group": "p154"},
{"id": "p155", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "台風の被害は［　　］だ", "options": {"A": "遠大", "B": "寛大", "C": "極大", "D": "甚大（ジンダイ）", "E": "尊大", "F": "膨大"}, "answer": "D", "memo": "遠大＝計画や構想が非常に広く長期的であること。\n尊大＝偉そうに人を見下した態度。\n膨大＝数量や規模が非常に大きいこと。", "subject": "lang", "group": "p155"},
{"id": "p156", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "この界隈（カイワイ）で幅を［　　］", "options": {"A": "取る", "B": "広げる", "C": "見せる", "D": "利かせる", "E": "もたせる"}, "answer": "D", "memo": "幅を利かせる＝自分の存在を大きく認めさせる、勢力をふるう。", "subject": "lang", "group": "p156"},
{"id": "p157", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "一晩寝れば疲れが<u>とれる</u>", "options": {"A": "1年に米が2回<u>とれる</u>", "B": "左右のバランスが<u>とれる</u>", "C": "社会に出れば角が<u>とれる</u>", "D": "全体として調和が<u>とれる</u>", "E": "その川ではアユが<u>とれる</u>", "F": "表面上は賛成とも<u>とれる</u>"}, "answer": "C", "memo": "好ましくないものが解消して、なくなること。", "subject": "lang", "group": "p157"},
{"id": "p158", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "電話<u>なり</u>手紙なりで知らせる", "options": {"A": "私<u>なり</u>の解釈で話す", "B": "何<u>なり</u>と言いなさい", "C": "すぐ人の言う<u>なり</u>になる", "D": "顔を見る<u>なり</u>叱りつける", "E": "曲がり<u>なり</u>にも店をかまえる"}, "answer": "B", "memo": "複数の選択肢を並べて示す用法。「何でも、どんなことでも」。", "subject": "lang", "group": "p158"},
{"id": "p159", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "電気製品 ： 掃除機<br>　　船舶 ： （　　）", "options": {"A": "港", "B": "船員", "C": "甲板", "D": "船荷", "E": "タンカー"}, "answer": "E", "memo": "包含関係。掃除機は電気製品の一種、タンカーは船舶の一種。", "subject": "lang", "group": "p159"},
{"id": "p160", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "学校 ： 高校<br>　　常緑樹 ： （　　）", "options": {"A": "松", "B": "森林", "C": "樹木", "D": "落葉樹", "E": "いちょう"}, "answer": "A", "memo": "包含関係。松は常緑樹の一種。いちょうは落葉樹。", "subject": "lang", "group": "p160"},
{"id": "p161", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "能や歌舞伎（キ）の「型」に見られる日本の演劇表現は、人間の動作を人形芝居のように［①］することによって、細かい動きや［②］な演技では表現しきれない、象徴化された喜怒哀楽を表現するものである。", "options": {"A": "①解放　②写実的", "B": "①解放　②伝統的", "C": "①限定　②写実的", "D": "①限定　②伝統的", "E": "①増幅　②写実的", "F": "①増幅　②伝統的"}, "answer": "C", "memo": "", "subject": "lang", "group": "p161"},
{"id": "p162", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "ハンムラビ法典には、もし医師が手術に失敗すればその医師の手を切り取ってもよいという条文があった。［①］、古バビロニア王国には［②］がほとんどいなかったといわれており、病人が出ると広場に連れ出し、通行人に治療法を教わっていた。", "options": {"A": "①しかし　②医師", "B": "①しかし　②病人", "C": "①このため　②医師", "D": "①このため　②病人", "E": "①それにもかかわらず　②医師", "F": "①それにもかかわらず　②病人"}, "answer": "C", "memo": "手術に失敗すると罰せられるため、医師のなり手がいなくなったという因果関係。", "subject": "lang", "group": "p162"},
{"id": "p163", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "ジャガイモのふるさとアンデス山脈の［1］［2］［3］［4］［5］作られている<br><br>［1］にあてはまるものはつぎのうちどれか。", "options": {"A": "チューニョと呼ばれる乾燥イモが", "B": "今もジャガイモが盛んに栽培され", "C": "標高4000メートルを超す村々では", "D": "中央に位置するペルーやボリビアの", "E": "気温変化を利用して水分を除去した"}, "answer": "D", "memo": "正しい語順は D→C→B→E→A。", "subject": "lang", "group": "p163"},
{"id": "p164", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "メタンハイドレートは［1］［2］［3］［4］［5］商業化までの道のりは遠い<br><br>［4］にあてはまるものはつぎのうちどれか。", "options": {"A": "広い海域で存在が確認され", "B": "メタンガスと水が結晶化した", "C": "生産試験も始まっているものの", "D": "「燃える氷」といわれるもので", "E": "太平洋側や日本海など日本近海の"}, "answer": "A", "memo": "正しい語順は B→D→E→A→C。", "subject": "lang", "group": "p164"},
{"id": "p165", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "<u>殊勝</u>な心がけの持ち主だ", "options": {"A": "健気（ケナゲ）な", "B": "可憐（レン）な", "C": "優雅な", "D": "利口な", "E": "堅実な", "F": "素直な"}, "answer": "A", "memo": "優雅＝ゆったりして上品なこと。\n堅実＝手堅く危なげがないこと。", "subject": "lang", "group": "p165"},
{"id": "p166", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "立場やよりどころを定めること", "options": {"A": "依拠", "B": "依存", "C": "典拠", "D": "立脚", "E": "立地"}, "answer": "D", "memo": "依拠＝頼りにできる根拠。\n立脚＝物事を考える基礎を置くこと。", "subject": "lang", "group": "p166"},
{"id": "p167", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "以前からの願い", "options": {"A": "切願", "B": "宿願", "C": "懇願", "D": "悲願", "E": "念願"}, "answer": "B", "memo": "切願＝強く熱心に願う。\n懇願＝真心から願う。\n悲願＝どうしても成し遂げようと願う。\n念願＝いつも心にかけて願うこと。", "subject": "lang", "group": "p167"},
{"id": "p168", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "一時しのぎにとりつくろっておくこと", "options": {"A": "虚勢", "B": "見栄（エ）", "C": "糊（コ）塗", "D": "虚飾", "E": "上塗り"}, "answer": "C", "memo": "上塗り＝表面を覆って隠す。また、事態をさらに悪化させること。", "subject": "lang", "group": "p168"},
{"id": "p169", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "世俗的な物事にこだわらないさま", "options": {"A": "粛然", "B": "整然", "C": "泰然", "D": "超然", "E": "冷然"}, "answer": "D", "memo": "粛然＝つつしんでかしこまるさま。\n泰然＝落ち着いていて動じないさま。", "subject": "lang", "group": "p169"},
{"id": "p170", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "好ましくないとして拒み退けること", "options": {"A": "遺棄", "B": "邪険", "C": "敬遠", "D": "疎外", "E": "排斥"}, "answer": "E", "memo": "邪険＝無慈悲で冷たいこと。\n敬遠＝表面は敬うように見せかけて実際は避けること。", "subject": "lang", "group": "p170"},
{"id": "p171", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "彼の芸はまさに［　　］期を迎えていますね", "options": {"A": "円熟", "B": "熟成", "C": "熟達", "D": "成育", "E": "成熟"}, "answer": "A", "memo": "円熟＝経験を積んで技術や表現が豊かになっていること。\n成熟＝十分に成長し発達していること。", "subject": "lang", "group": "p171"},
{"id": "p172", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "事態の［　　］を見守る", "options": {"A": "移行", "B": "急変", "C": "推移", "D": "転換", "E": "変遷", "F": "流転"}, "answer": "C", "memo": "変遷や転換は長期的な変化に使う。", "subject": "lang", "group": "p172"},
{"id": "p173", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "一笑に［　　］", "options": {"A": "誘う", "B": "処す", "C": "流す", "D": "付す", "E": "飛ばす", "F": "あしらう"}, "answer": "D", "memo": "一笑に付す＝つまらないものとして笑い飛ばすこと。\nあしらう＝いいかげんに扱う。", "subject": "lang", "group": "p173"},
{"id": "p174", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "<u>のぞむ</u>ところだ", "options": {"A": "海に<u>のぞむ</u>家", "B": "別れの場に<u>のぞむ</u>", "C": "落ち着いて交渉に<u>のぞむ</u>", "D": "自立心を子どもに<u>のぞむ</u>", "E": "来賓として式場に<u>のぞむ</u>", "F": "試合に一丸となって<u>のぞむ</u>"}, "answer": "D", "memo": "期待する、望むという意味。", "subject": "lang", "group": "p174"},
{"id": "p175", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "感覚 ： 味覚<br>　　書籍 ： （　　）", "options": {"A": "文芸", "B": "図書", "C": "聖書", "D": "出版", "E": "読書"}, "answer": "C", "memo": "包含関係。味覚は感覚の一種、聖書は書籍の一種。", "subject": "lang", "group": "p175"},
{"id": "p176", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "すべてが流動し選択化している今日、［　　］は不安定性の増大と表裏一体である。個人は束縛から解放され自由に移動できることを喜びつつも、どこにおのれの居場所があるのか必死に探している。", "options": {"A": "個人の自律性", "B": "組織への従属", "C": "他者との関係", "D": "家族関係の希薄化", "E": "自由と選択の拡大", "F": "適切な対処法の発見"}, "answer": "E", "memo": "", "subject": "lang", "group": "p176"},
{"id": "p177", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "「カエルが鳴くと雨」や「朝焼けは雨」といった天気に関することわざは数多くあるが、いずれもある地点での空模様の観察の積み重ねから得られた［①］に関する［②］であるといえる。", "options": {"A": "①自然の観察　②確率論", "B": "①自然の観察　②経験則", "C": "①地域の特性　②確率論", "D": "①地域の特性　②経験則", "E": "①天気の変化　②確率論", "F": "①天気の変化　②経験則"}, "answer": "F", "memo": "", "subject": "lang", "group": "p177"},
{"id": "p178", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "無作為に対象者を選ぶ［1］［2］［3］［4］［5］傾向がある<br><br>［2］にあてはまるものはつぎのうちどれか。", "options": {"A": "より極端な結果が出る", "B": "世論調査と比較すると", "C": "インターネット調査の場合は", "D": "特定のテーマに関心をもって", "E": "サイトを閲覧した人が回答する"}, "answer": "C", "memo": "正しい語順は B→C→D→E→A。", "subject": "lang", "group": "p178"},
{"id": "p179", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "法律の制定のためには［1］［2］［3］［4］［5］設定されていなくてはならない<br><br>［3］にあてはまるものはつぎのうちどれか。", "options": {"A": "抜かりなく見通され", "B": "処罰の仕方があらかじめ", "C": "社会生活において起こりうる", "D": "その成り行きに対する対応が", "E": "さまざまの場合を周到に見て取り"}, "answer": "D", "memo": "正しい語順は C→E→D→A→B。", "subject": "lang", "group": "p179"},
{"id": "p180", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "賢者の言葉を紹介した本が出版される中、巷（チマタ）でよく聞かれるのが、「ゲーテは今から200年も前の人なのにこんなにすごいことを言っていたのか。驚きました」といった類（タグ）いの反応だ。これは近代＝進歩史観に完全に毒された考え方である。すなわち、時間の経過とともに人間精神が進化するという妄想だ。かつては「昔の人［　　］すごい」という感慨はあっても「昔の人なのにすごい」という感覚はなかった。偉大な過去に驚異を感じ、畏（イ）敬の念を抱き、古典の模倣を繰り返すことにより文明は維持されてきたからだ。過去は単純に美化されたのではなく、常に現在との緊張関係において捉（トラ）えられていた。ところが近代において進歩史観が勝利を占め、歴史は学問の対象に、古典は教養の枠に閉じ込められた。大衆社会において、ついに歴史は趣味になる。現代人の趣味に合わないものは「昔の人の価値観だから」と否定されるようになった。大衆は自分たちが文化の最前線にいると思い込むようになり、古典的な規範を認めず、視線を未来にだけ向けるようになった。", "source": "（適菜収「賢者に学ぶ」『産経新聞』、2012年6月8日）", "stem": "文中の空所［　　］に入れることばとして最も適切なものは、つぎのうちどれか。", "options": {"A": "でも", "B": "だから", "C": "なりに", "D": "としては"}, "answer": "B", "flag": "要確認", "memo": "「昔の人なのにすごい」（進歩史観）と対比される、過去を偉大とみる態度。\n※PDFでは「B or C ?」と迷った跡があり、Cが選択されています。文脈からBを採用しています。", "subject": "lang", "group": "p180"},
{"id": "p181", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "賢者の言葉を紹介した本が出版される中、巷（チマタ）でよく聞かれるのが、「ゲーテは今から200年も前の人なのにこんなにすごいことを言っていたのか。驚きました」といった類（タグ）いの反応だ。これは近代＝進歩史観に完全に毒された考え方である。すなわち、時間の経過とともに人間精神が進化するという妄想だ。かつては「昔の人［　　］すごい」という感慨はあっても「昔の人なのにすごい」という感覚はなかった。偉大な過去に驚異を感じ、畏（イ）敬の念を抱き、古典の模倣を繰り返すことにより文明は維持されてきたからだ。過去は単純に美化されたのではなく、常に現在との緊張関係において捉（トラ）えられていた。ところが近代において進歩史観が勝利を占め、歴史は学問の対象に、古典は教養の枠に閉じ込められた。大衆社会において、ついに歴史は趣味になる。現代人の趣味に合わないものは「昔の人の価値観だから」と否定されるようになった。大衆は自分たちが文化の最前線にいると思い込むようになり、古典的な規範を認めず、視線を未来にだけ向けるようになった。", "source": "（適菜収「賢者に学ぶ」『産経新聞』、2012年6月8日）", "stem": "文中下線の部分「考え方」にあてはまることは、つぎのうちどれか。", "options": {"A": "過去を単純に美化する", "B": "歴史は学問の対象にすぎない", "C": "文化の最前線にいるのは現代人である", "D": "人間精神は時間の経過とともに進化する"}, "answer": ["B", "C", "D"], "memo": "過去は単純に美化されたのではない、と述べられている。", "subject": "lang", "group": "p181"},
{"id": "p182", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "賢者の言葉を紹介した本が出版される中、巷（チマタ）でよく聞かれるのが、「ゲーテは今から200年も前の人なのにこんなにすごいことを言っていたのか。驚きました」といった類（タグ）いの反応だ。これは近代＝進歩史観に完全に毒された考え方である。すなわち、時間の経過とともに人間精神が進化するという妄想だ。かつては「昔の人［　　］すごい」という感慨はあっても「昔の人なのにすごい」という感覚はなかった。偉大な過去に驚異を感じ、畏（イ）敬の念を抱き、古典の模倣を繰り返すことにより文明は維持されてきたからだ。過去は単純に美化されたのではなく、常に現在との緊張関係において捉（トラ）えられていた。ところが近代において進歩史観が勝利を占め、歴史は学問の対象に、古典は教養の枠に閉じ込められた。大衆社会において、ついに歴史は趣味になる。現代人の趣味に合わないものは「昔の人の価値観だから」と否定されるようになった。大衆は自分たちが文化の最前線にいると思い込むようになり、古典的な規範を認めず、視線を未来にだけ向けるようになった。", "source": "（適菜収「賢者に学ぶ」『産経新聞』、2012年6月8日）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "かつて過去は現在との緊張関係において捉えられていた", "B": "古典の模倣を繰り返さずに視線を未来に向けるべきである", "C": "進歩史観によって昔の人の価値観は否定されるようになった", "D": "文明は偉大な過去に驚異を感じ模倣することで維持されてきた"}, "answer": ["A", "C", "D"], "memo": "Bは筆者が批判している態度。", "subject": "lang", "group": "p182"},
{"id": "p183", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "心のもち方がしっかりしていること", "options": {"A": "頑健", "B": "気丈", "C": "強靭（キョウジン）", "D": "豪胆（ゴウタン）", "E": "骨太"}, "answer": "B", "memo": "頑健＝体が丈夫で健康なこと。\n豪胆＝危険に臨んでも大胆に処理すること。", "subject": "lang", "group": "p183"},
{"id": "p184", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "おごそかで重々しく感動的なさま", "options": {"A": "豪壮", "B": "重厚", "C": "粛然", "D": "神聖", "E": "荘厳（ソウゴン）"}, "answer": "E", "memo": "豪壮＝物事の規模が大きく立派なこと。", "subject": "lang", "group": "p184"},
{"id": "p185", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "欠点、悪習などを正しい状態になおすこと", "options": {"A": "修整", "B": "修正", "C": "矯正", "D": "整形", "E": "鍛錬"}, "answer": "C", "memo": "修整＝見た目や形を整えること。\n修正＝誤りや不備を正しく直すこと。", "subject": "lang", "group": "p185"},
{"id": "p186", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "巧みでないこと", "options": {"A": "つたない", "B": "ぎこちない", "C": "たわいない", "D": "ふがいない", "E": "おぼつかない"}, "answer": "A", "memo": "ぎこちない＝動作が固くて不自然。\nたわいない＝取るに足りない、しっかりしたところがない。\nふがいない＝情けない、意気地がない。\nおぼつかない＝たよりない、心もとない。", "subject": "lang", "group": "p186"},
{"id": "p187", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "ことばがつかえるような下手なしゃべり方", "options": {"A": "寡言（カゲン）", "B": "減らず口", "C": "絶句", "D": "訥弁（トツベン）", "E": "饒舌（ジョウゼツ）"}, "answer": "D", "memo": "寡言＝口数が少ないこと。\n絶句＝話が途中で詰まること。\n訥弁の対義語は能弁。\n饒舌＝むやみにしゃべり散らすこと。", "subject": "lang", "group": "p187"},
{"id": "p188", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "ある状態に固定して進展しないこと", "options": {"A": "膠（コウ）着", "B": "停滞", "C": "凍結", "D": "頓挫（トンザ）", "E": "保留"}, "answer": "A", "memo": "頓挫＝物事の進行が急にくじけること。", "subject": "lang", "group": "p188"},
{"id": "p189", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "ねらいを定めること", "options": {"A": "目星（メボシ）", "B": "目標", "C": "標的", "D": "見当", "E": "照準"}, "answer": "E", "memo": "目星＝目当て、こうだろうという見込み。", "subject": "lang", "group": "p189"},
{"id": "p190", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "生活をしていくための仕事", "options": {"A": "請負い", "B": "肩書き", "C": "食いぶち", "D": "なりわい", "E": "やりくり"}, "answer": "D", "memo": "食いぶち＝食べるための費用。\nやりくり＝あれこれ操作して都合をつけること。", "subject": "lang", "group": "p190"},
{"id": "p191", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "必要な物事を十分に備えていること", "options": {"A": "具備", "B": "常備", "C": "整備", "D": "装備", "E": "配備"}, "answer": "A", "memo": "", "subject": "lang", "group": "p191"},
{"id": "p192", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "［　　］を緩和する", "options": {"A": "関係", "B": "交通", "C": "興奮", "D": "混雑", "E": "性格", "F": "暴風"}, "answer": "D", "memo": "", "subject": "lang", "group": "p192"},
{"id": "p193", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "パートナー同伴が［　　］だ", "options": {"A": "慣例", "B": "恒例", "C": "実例", "D": "定例", "E": "範例", "F": "類例"}, "answer": "A", "memo": "恒例は儀式や行事、イベントについて使う。", "subject": "lang", "group": "p193"},
{"id": "p194", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "責任の所在を［　　］にする", "options": {"A": "あやふや", "B": "うやむや", "C": "おぼろげ", "D": "でたらめ", "E": "いいかげん", "F": "どっちつかず"}, "answer": "B", "memo": "あやふや＝記憶や説明が不確かなこと。\nうやむや＝物事をはっきりさせずに放置すること。\nおぼろげ＝ぼんやりして不明瞭。\nでたらめ＝筋が通らないこと。", "subject": "lang", "group": "p194"},
{"id": "p195", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "一朝<u>こと</u>あるとき", "options": {"A": "静かに食べる<u>こと</u>", "B": "食べた<u>こと</u>がない", "C": "正しい<u>こと</u>を言う", "D": "事件の<u>こと</u>は秘密だ", "E": "彼は<u>こと</u>を好む性格だ"}, "answer": "D", "memo": "特定の事件や出来事を指す用法。「何か重大なことが起こったとき」。", "subject": "lang", "group": "p195"},
{"id": "p196", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "再会の誓いで文を<u>むすぶ</u>", "options": {"A": "助詞で主語と述語を<u>むすぶ</u>", "B": "巧みな話術で協定を<u>むすぶ</u>", "C": "怒りで真一文字に口を<u>むすぶ</u>", "D": "部長のことばで歓迎会を<u>むすぶ</u>", "E": "インターネットで世界中を<u>むすぶ</u>"}, "answer": "D", "memo": "終わりにする、締めくくるという意味。", "subject": "lang", "group": "p196"},
{"id": "p197", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "通信機 ： 通信<br>　　ミット ： （　　）", "options": {"A": "捕球", "B": "捕手", "C": "投球", "D": "ボール", "E": "グローブ"}, "answer": "A", "memo": "用途の関係。", "subject": "lang", "group": "p197"},
{"id": "p198", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "覚える ： 忘れる<br>　　委細 ： （　　）", "options": {"A": "概括", "B": "概略", "C": "要綱", "D": "要点", "E": "細大"}, "answer": "B", "memo": "対義語の関係。概略＝細部を略して示すこと。\n概括＝共通する性質を抽出して一つにまとめること。\n細大＝細かい点も大きな点もすべて。", "subject": "lang", "group": "p198"},
{"id": "p199", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "日本語には同音類義語が多く、たとえば、「たいせい」には「態勢」と「体制」の類義語がある。「態勢」は［①］な状態であり、何かのためにその場で作られた態度であり、動的である。「体制」は［②］な組織または制度を指す場合に使われ、どちらかといえば静的である。", "options": {"A": "①一時的　②持続的", "B": "①一時的　②断続的", "C": "①持続的　②一時的", "D": "①持続的　②断続的", "E": "①断続的　②一時的", "F": "①断続的　②持続的"}, "answer": "A", "memo": "", "subject": "lang", "group": "p199"},
{"id": "p200", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "霊長類と鳥類は食べられるかどうかの判断に［①］から得られる情報を生かしている。それに対し、［②］の動物は嗅覚や聴覚をよりどころにして暮らしているので、そうした能力はあまり必要がなく、フルカラーの視覚をもっているものは少ない。", "options": {"A": "①味　②草食性", "B": "①味　②夜行性", "C": "①色　②草食性", "D": "①色　②夜行性", "E": "①匂い　②草食性", "F": "①匂い　②夜行性"}, "answer": "D", "memo": "", "subject": "lang", "group": "p200"},
{"id": "p201", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "弥生時代の日本では［1］［2］［3］［4］［5］稲を運んでいた<br><br>［1］にあてはまるものはつぎのうちどれか。", "options": {"A": "底の浅い船が発達し", "B": "揚子江や黄河などで", "C": "この船が内陸地方にも", "D": "水上交易に用いられていた", "E": "中国の川船をモデルにした"}, "answer": "B", "memo": "正しい語順は B→D→E→A→C。", "subject": "lang", "group": "p201"},
{"id": "p202", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "人は報酬を必ず［1］［2］［3］［4］［5］人がギャンブルに溺（オボ）れる理由のひとつだという<br><br>［4］にあてはまるものはつぎのうちどれか。", "options": {"A": "得られる場合よりも", "B": "これは部分強化といわれ", "C": "執着が強くなることがあり", "D": "報酬のもととなる行為への", "E": "間欠的に得られる場合のほうが"}, "answer": "C", "memo": "正しい語順は A→E→D→C→B。", "subject": "lang", "group": "p202"},
{"id": "p203", "type": "single", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "利根川の源流はどこだろうか。その答えを探すため、明治27年（1894）9月に最初の利根川源流探しの探検が行われたが失敗した。その後も、いくつかの探検隊が試みたがことごとく失敗に終わり、源流が確定したのは昭和29年（1954）8月であった。成否を分けた理由は種々あるが、一つには詳細な地図がなかったからだと思われる。現地にあるいずれの谷が主流なのかが、当時まだ不明だった。そのため暗中模索の源流探しだった。<br>　川について、図式と呼ばれる地図に関する規則では「河川は、平水時の水流の幅が1.5メートル以上のものを表示する」とある。源流は、ごく小さな流れから始まる例が多い。地図上の川の始まりが実際の源流地点と一致するのは極めて稀（マレ）であり、源流地点はおおむね地図に表示された川の、もっと先にある。ちなみに、利根川の源流付近には、昭和63年（1988）に当時の建設省などによって建てられた「利根川水源碑」が尾根筋にあって、その直下の水流が源流地点である。", "source": "（山岡光治『地図に訊け！』、筑摩書房）", "stem": "利根川の源流が確定できなかった理由として文中で述べられていることは、つぎのうちどれか。", "options": {"A": "源流を探す知識がなかった", "B": "主流がそのときどきで変わった", "C": "河川の定義ができていなかった", "D": "どの谷が主流かわかっていなかった"}, "answer": "D", "memo": "", "subject": "lang", "group": "p203"},
{"id": "p204", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の2問目）あてはまるものをすべて選びなさい。", "passage": "利根川の源流はどこだろうか。その答えを探すため、明治27年（1894）9月に最初の利根川源流探しの探検が行われたが失敗した。その後も、いくつかの探検隊が試みたがことごとく失敗に終わり、源流が確定したのは昭和29年（1954）8月であった。成否を分けた理由は種々あるが、一つには詳細な地図がなかったからだと思われる。現地にあるいずれの谷が主流なのかが、当時まだ不明だった。そのため暗中模索の源流探しだった。<br>　川について、図式と呼ばれる地図に関する規則では「河川は、平水時の水流の幅が1.5メートル以上のものを表示する」とある。源流は、ごく小さな流れから始まる例が多い。地図上の川の始まりが実際の源流地点と一致するのは極めて稀（マレ）であり、源流地点はおおむね地図に表示された川の、もっと先にある。ちなみに、利根川の源流付近には、昭和63年（1988）に当時の建設省などによって建てられた「利根川水源碑」が尾根筋にあって、その直下の水流が源流地点である。", "source": "（山岡光治『地図に訊け！』、筑摩書房）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "利根川の源流が確定したのは昭和63年である", "B": "利根川の源流の発見は第二次探検隊の功績である", "C": "利根川の源流付近には発見当時に建てられた水源碑がある", "D": "利根川の源流が確定するまで最初の探検から半世紀以上を要した"}, "answer": ["D"], "memo": "明治27年の最初の探検から昭和29年の確定まで約60年。水源碑が建てられたのは昭和63年で、発見当時ではない。", "subject": "lang", "group": "p204"},
{"id": "p205", "type": "multi", "cat": "長文読解", "instruction": "つぎの文を読んで、各問いに答えなさい。（3問組の3問目）あてはまるものをすべて選びなさい。", "passage": "利根川の源流はどこだろうか。その答えを探すため、明治27年（1894）9月に最初の利根川源流探しの探検が行われたが失敗した。その後も、いくつかの探検隊が試みたがことごとく失敗に終わり、源流が確定したのは昭和29年（1954）8月であった。成否を分けた理由は種々あるが、一つには詳細な地図がなかったからだと思われる。現地にあるいずれの谷が主流なのかが、当時まだ不明だった。そのため暗中模索の源流探しだった。<br>　川について、図式と呼ばれる地図に関する規則では「河川は、平水時の水流の幅が1.5メートル以上のものを表示する」とある。源流は、ごく小さな流れから始まる例が多い。地図上の川の始まりが実際の源流地点と一致するのは極めて稀（マレ）であり、源流地点はおおむね地図に表示された川の、もっと先にある。ちなみに、利根川の源流付近には、昭和63年（1988）に当時の建設省などによって建てられた「利根川水源碑」が尾根筋にあって、その直下の水流が源流地点である。", "source": "（山岡光治『地図に訊け！』、筑摩書房）", "stem": "文中で述べられていることと合致するものは、つぎのうちどれか。", "options": {"A": "源流地点は通常地図に表示された川のもっと先にある", "B": "地図上の川の始まりが実際の源流と一致することはない", "C": "源流は平水時の水流の幅が1.5メートル以上のものを指す", "D": "源流が確定した場合、地図上に表示することが定められている"}, "answer": ["A"], "memo": "一致するのは「極めて稀」であり、一致することがないわけではない。1.5メートルは地図に河川を表示する基準。", "subject": "lang", "group": "p205"},
{"id": "p206", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "準備ができたところでゆっくりと動き始めるさま", "options": {"A": "やおら", "B": "おずおず", "C": "おっつけ", "D": "おっとり", "E": "そそくさ", "F": "ひょうひょう"}, "answer": "A", "memo": "おずおず＝相手を恐れてためらいながら。\nおっつけ＝そのうち、まもなく。\nそそくさ＝落ち着かず慌ただしいさま。\nひょうひょう＝世俗にこだわらず悠然としたさま。", "subject": "lang", "group": "p206"},

{"id": "p208", "type": "single", "cat": "語句の意味", "instruction": "下線部分のことばの意味を考え、意味が最もよく合致するものを1つ選びなさい。", "stem": "その場に応じた機転を働かせること", "options": {"A": "即座", "B": "即断", "C": "即妙", "D": "即興", "E": "即効"}, "answer": "C", "memo": "当意即妙という言い方をする。", "subject": "lang", "group": "p208"},

{"id": "p211", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "積年の不満が［　　］", "options": {"A": "かくれる", "B": "くすぶる", "C": "とどまる", "D": "につまる", "E": "はびこる", "F": "とどこおる"}, "answer": "B", "memo": "くすぶる＝解決しないまま状態が続くこと。", "subject": "lang", "group": "p211"},
{"id": "p212", "type": "single", "cat": "語句の用法", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "毎日を［　　］に暮らす", "options": {"A": "無為", "B": "無常", "C": "無心", "D": "無駄", "E": "無用"}, "answer": "A", "flag": "要確認", "memo": "無為に暮らす＝何もしないで日を過ごす。\n※PDFでは判断が分かれた跡があります。", "subject": "lang", "group": "p212"},

{"id": "p215", "type": "single", "cat": "語句の意味（多義語）", "instruction": "下線部分の語の意味を考え、選択肢の中で下線の語がこれと最も近い意味に使われているものを1つ選びなさい。", "stem": "彼<u>まで</u>もが聞いてくれない", "options": {"A": "夢に<u>まで</u>見る", "B": "考える<u>まで</u>もない", "C": "夜明け<u>まで</u>降り続く", "D": "週末<u>まで</u>待ってください", "E": "言わない<u>まで</u>も考えておく", "F": "とりあえずお礼の気持ち<u>まで</u>"}, "answer": "A", "memo": "意外性や範囲の広がりを強調する用法。", "subject": "lang", "group": "p215"},
{"id": "p216", "type": "single", "cat": "二語の関係", "instruction": "最初に提示された2語の関係を考え、これと同じ関係をあらわす対をつくるために（　）にあてはまる最も適切な語を1つ選びなさい。", "stem": "安全 ： 危険<br>　　念入り ： （　　）", "options": {"A": "みだり", "B": "むやみ", "C": "ぞんざい", "D": "ほどほど", "E": "ないがしろ"}, "answer": "C", "memo": "対義語の関係。\nみだり＝道理に反するさま。\nないがしろ＝あっても無いかのように軽んじること。", "subject": "lang", "group": "p216"},
{"id": "p217", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "普遍性と同一性の発見は、おそらくそれ自体では祝福されるべき事態だと思います。なによりそれは、孤独や孤立や絶望に対処するための、最も有効な手段です。「［　　］」と考えて気が楽になるのは、こうした場合です。", "options": {"A": "人は人だから", "B": "自分にかぎっては", "C": "自分は特別だから", "D": "自分なんかどうでも", "E": "だれでもみんなある程度は"}, "answer": "E", "memo": "", "subject": "lang", "group": "p217"},
{"id": "p218", "type": "single", "cat": "空欄補充", "instruction": "つぎの文の意味やことばの使い方から考えて、［　］に入れる語句として最も適切なものを1つ選びなさい。", "stem": "鳩（ハト）を単独で飼育していると、その鳩は時期が来ても所定の性行動を行わない。しかし飼育室に鏡を入れておくと、それだけで性徴を発現させるようになる。自分の鏡像を見ることが、［　　］ことから得られる何らかの効果を、代行する形で鳩に与えるのである。", "options": {"A": "野生の鳥として育つ", "B": "異性から求められる", "C": "発情の時期を迎える", "D": "他の鳩とともに生きる", "E": "多くの人に観賞される"}, "answer": "D", "flag": "要確認", "memo": "単独飼育で性行動が起こらない点との対比。\n※PDFではBが選択され、赤字ではDとされています。文意からDを採用しています。", "subject": "lang", "group": "p218"},
{"id": "p219", "type": "single", "cat": "文の並べ替え", "instruction": "AからEまでのことばを空所［1］から［5］に入れて意味の通る文を完成させます。そのとき指定された空所にあてはまるものを1つ選びなさい。", "stem": "建築家は［1］［2］［3］［4］［5］把握することが必要である<br><br>［4］にあてはまるものはつぎのうちどれか。", "options": {"A": "残したいと願うものだが", "B": "その作品を百年単位の時間で", "C": "未来に引き継いでいきたいものを", "D": "昔から変わらずに伝えられてきたものや", "E": "そのためには現在必要なものだけではなく"}, "answer": "D", "memo": "正しい語順は B→A→E→D→C。", "subject": "lang", "group": "p219"},
{"id": "m001", "subject": "math", "type": "single", "cat": "資料の読み取り", "instruction": "つぎに示した表や資料を使って、各問いに答えなさい。（3問組の1問目）", "passage": "JからNまでの5種類の混合ガスに含まれる各成分の気体の体積百分率は、それぞれつぎのとおりである。なお、〔　〕内は炭酸ガスの重さを100としたときの同体積の各気体の重さを示す。<table><caption>〈混合ガス成分表〉</caption><tr><th></th><th></th><th>Jガス</th><th>Kガス</th><th>Lガス</th><th>Mガス</th><th>Nガス</th></tr><tr><td>炭酸ガス</td><td>〔100.0〕</td><td>2.1%</td><td>4.3%</td><td>13.4%</td><td>13.2%</td><td>2.8%</td></tr><tr><td>酸素</td><td>〔72.7〕</td><td>1.2</td><td>1.4</td><td>1.1</td><td>1.5</td><td>5.1</td></tr><tr><td>一酸化炭素</td><td>〔63.6〕</td><td>9.3</td><td>3.5</td><td>12.5</td><td>32.1</td><td>4.1</td></tr><tr><td>水素</td><td>〔4.5〕</td><td>48.2</td><td>16.1</td><td>43.9</td><td>34.9</td><td>63.5</td></tr><tr><td>メタン</td><td>〔36.4〕</td><td>31.7</td><td>37.8</td><td>16.8</td><td>17.7</td><td>7.0</td></tr><tr><td>その他</td><td></td><td>7.5</td><td>（　）</td><td>12.3</td><td>0.6</td><td>17.5</td></tr><tr><td>計</td><td></td><td>100.0</td><td>100.0</td><td>100.0</td><td>100.0</td><td>100.0</td></tr></table>", "stem": "Kガスの「その他」の体積百分率はいくらか（必要なときは、最後に小数点以下第2位を四捨五入すること）。", "options": {"A": "31.9%", "B": "32.9%", "C": "33.9%", "D": "34.9%", "E": "35.9%", "F": "36.9%", "G": "37.9%", "H": "38.9%", "I": "39.9%", "J": "AからIのいずれでもない"}, "answer": "F", "group": "m001"},

{"id": "m003", "subject": "math", "type": "single", "cat": "資料の読み取り", "instruction": "つぎに示した表や資料を使って、各問いに答えなさい。（3問組の3問目）", "passage": "JからNまでの5種類の混合ガスに含まれる各成分の気体の体積百分率は、それぞれつぎのとおりである。なお、〔　〕内は炭酸ガスの重さを100としたときの同体積の各気体の重さを示す。<table><caption>〈混合ガス成分表〉</caption><tr><th></th><th></th><th>Jガス</th><th>Kガス</th><th>Lガス</th><th>Mガス</th><th>Nガス</th></tr><tr><td>炭酸ガス</td><td>〔100.0〕</td><td>2.1%</td><td>4.3%</td><td>13.4%</td><td>13.2%</td><td>2.8%</td></tr><tr><td>酸素</td><td>〔72.7〕</td><td>1.2</td><td>1.4</td><td>1.1</td><td>1.5</td><td>5.1</td></tr><tr><td>一酸化炭素</td><td>〔63.6〕</td><td>9.3</td><td>3.5</td><td>12.5</td><td>32.1</td><td>4.1</td></tr><tr><td>水素</td><td>〔4.5〕</td><td>48.2</td><td>16.1</td><td>43.9</td><td>34.9</td><td>63.5</td></tr><tr><td>メタン</td><td>〔36.4〕</td><td>31.7</td><td>37.8</td><td>16.8</td><td>17.7</td><td>7.0</td></tr><tr><td>その他</td><td></td><td>7.5</td><td>（　）</td><td>12.3</td><td>0.6</td><td>17.5</td></tr><tr><td>計</td><td></td><td>100.0</td><td>100.0</td><td>100.0</td><td>100.0</td><td>100.0</td></tr></table>", "stem": "ある量のNガス中の炭酸ガスの重さが5.6gであった。このとき酸素の重さはいくらか（必要なときは、最後に小数点以下第2位を四捨五入すること）。", "options": {"A": "2.3g", "B": "3.4g", "C": "4.3g", "D": "5.2g", "E": "6.1g", "F": "7.4g", "G": "8.2g", "H": "9.4g", "I": "10.2g", "J": "AからIのいずれでもない"}, "answer": "F", "group": "m001"},
{"id": "m004", "subject": "math", "type": "single", "cat": "推論（順位）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）", "passage": "J、K、L、M、Nの5チームが参加して毎年行われる野球大会がある。今年の結果について、つぎのことがわかった。<br>Ⅰ）Jは昨年に比べて、順位が3つ下がった<br>Ⅱ）昨年も今年もNの順位はMの順位の1つ上だった<br>Ⅲ）今年Kは2位だった<br>Ⅳ）昨年と順位が同じチームは1つもなかった", "stem": "昨年Mは何位だったか。", "options": {"A": "1位", "B": "2位", "C": "3位", "D": "4位", "E": "5位", "F": "これだけでは決まらない"}, "answer": "E", "group": "m004"},
{"id": "m005", "subject": "math", "type": "single", "cat": "推論（順位）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の2問目）", "passage": "J、K、L、M、Nの5チームが参加して毎年行われる野球大会がある。今年の結果について、つぎのことがわかった。<br>Ⅰ）Jは昨年に比べて、順位が3つ下がった<br>Ⅱ）昨年も今年もNの順位はMの順位の1つ上だった<br>Ⅲ）今年Kは2位だった<br>Ⅳ）昨年と順位が同じチームは1つもなかった", "stem": "つぎのア、イ、ウのうち、正しいといえるものはどれか。AからHまでの中から1つ選びなさい。<br>ア　昨年1位になったのはKである<br>イ　Nは今年も昨年も3位以上になっていない<br>ウ　今年、LはMより上位だった", "options": {"A": "アだけ", "B": "イだけ", "C": "ウだけ", "D": "アとイの両方", "E": "アとウの両方", "F": "イとウの両方", "G": "アとイとウのすべて", "H": "ア、イ、ウのいずれも正しくない"}, "answer": "E", "group": "m004"},
{"id": "m006", "subject": "math", "type": "single", "cat": "場合の数", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）", "passage": "生徒会の役員に男子4人、女子5人が立候補した。この中から会長と副会長を1人ずつと書記を2人選出する。ただし、兼任はしないものとする。", "stem": "選出されるのがいずれも女子である場合、その組み合わせは何通りあるか。", "options": {"A": "5通り", "B": "12通り", "C": "24通り", "D": "60通り", "E": "63通り", "F": "120通り", "G": "126通り", "H": "180通り", "I": "240通り", "J": "AからIのいずれでもない"}, "answer": "D", "group": "m006"},
{"id": "m007", "subject": "math", "type": "single", "cat": "場合の数", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の2問目）", "passage": "生徒会の役員に男子4人、女子5人が立候補した。この中から会長と副会長を1人ずつと書記を2人選出する。ただし、兼任はしないものとする。", "stem": "選出される会長と副会長の性別が異なり、さらに書記も男女1人ずつである場合、その組み合わせは何通りあるか。", "options": {"A": "60通り", "B": "120通り", "C": "240通り", "D": "360通り", "E": "480通り", "F": "600通り", "G": "720通り", "H": "840通り", "I": "960通り", "J": "AからIのいずれでもない"}, "answer": "E", "group": "m006"},
{"id": "m008", "subject": "math", "type": "single", "cat": "割合と比", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）", "passage": "ある兄弟がキャラクターのカードを集めている。これまでに集めたカードは兄が120枚、弟が75枚である。", "stem": "兄のカードのうち35.0%はキャラクターPのものである。兄と弟が集めたキャラクターPのカードの枚数が等しいとき、弟のカードのうちキャラクターPのものは何%か（必要なときは、最後に小数点以下第2位を四捨五入すること）。", "options": {"A": "21.9%", "B": "26.3%", "C": "33.3%", "D": "35.0%", "E": "42.0%", "F": "46.7%", "G": "50.5%", "H": "56.0%", "I": "60.2%", "J": "AからIのいずれでもない"}, "answer": "H", "group": "m008"},
{"id": "m009", "subject": "math", "type": "single", "cat": "割合と比", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の2問目）", "passage": "ある兄弟がキャラクターのカードを集めている。これまでに集めたカードは兄が120枚、弟が75枚である。", "stem": "弟のカードのうち28.0%はキャラクターQのものである。兄が弟にキャラクターQのカードを5枚あげるとき、弟のカードのうちキャラクターQのものは何%になるか（必要なときは、最後に小数点以下第2位を四捨五入すること）。", "options": {"A": "30.0%", "B": "30.6%", "C": "31.2%", "D": "31.8%", "E": "32.5%", "F": "33.0%", "G": "33.6%", "H": "34.0%", "I": "34.7%", "J": "AからIのいずれでもない"}, "answer": "E", "group": "m008"},
{"id": "m010", "subject": "math", "type": "multi", "cat": "推論（順序）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）あてはまるものをすべて選びなさい。", "passage": "P、Q、R、Sの4人の年齢と身長について、つぎのことがわかっている。<br>Ⅰ）4人の年齢、身長はそれぞれ異なっている<br>Ⅱ）RはSより年上、Qより年下である<br>Ⅲ）PはQより身長が高い<br>Ⅳ）最も身長が高いのは、最も年下の人である", "stem": "仮にPはRより年上だとすると、最も身長が低いと考えられるのはだれか。", "options": {"A": "P", "B": "Q", "C": "R", "D": "S"}, "answer": ["B", "C"], "group": "m010"},
{"id": "m011", "subject": "math", "type": "multi", "cat": "推論（順序）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の2問目）あてはまるものをすべて選びなさい。", "passage": "P、Q、R、Sの4人の年齢と身長について、つぎのことがわかっている。<br>Ⅰ）4人の年齢、身長はそれぞれ異なっている<br>Ⅱ）RはSより年上、Qより年下である<br>Ⅲ）PはQより身長が高い<br>Ⅳ）最も身長が高いのは、最も年下の人である", "stem": "仮に最も身長が低いのは最も年上の人だとすると、2番目に身長が高いと考えられるのはだれか。", "options": {"A": "P", "B": "Q", "C": "R", "D": "S"}, "answer": ["A", "C", "D"], "group": "m010"},
{"id": "m012", "subject": "math", "type": "multi", "cat": "推論（位置）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）あてはまるものをすべて選びなさい。", "passage": "サイコロを振り、偶数の目が出たら右に1マス、奇数の目が出たら左に1マス駒を進める遊びをする。ただし、初めはスタート地点に位置するものとする。マスは左から順に1番から7番まで7つあり、スタート地点は中央の4番のマスである。", "stem": "2回サイコロを振って遊ぶことにした。1回目は5の目が出たとすると、2回振り終わったとき、駒はどのマスに位置すると考えられるか。", "options": {"A": "1番のマス", "B": "2番のマス", "C": "3番のマス", "D": "4番のマス（スタート）", "E": "5番のマス", "F": "6番のマス", "G": "7番のマス"}, "answer": ["B", "D"], "group": "m012"},
{"id": "m013", "subject": "math", "type": "multi", "cat": "推論（位置）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の2問目）あてはまるものをすべて選びなさい。", "passage": "サイコロを振り、偶数の目が出たら右に1マス、奇数の目が出たら左に1マス駒を進める遊びをする。ただし、初めはスタート地点に位置するものとする。マスは左から順に1番から7番まで7つあり、スタート地点は中央の4番のマスである。", "stem": "3回サイコロを振って遊ぶことにした。3回振り終わって出た目の合計が8だったとき、駒はどのマスに位置すると考えられるか。", "options": {"A": "1番のマス", "B": "2番のマス", "C": "3番のマス", "D": "4番のマス（スタート）", "E": "5番のマス", "F": "6番のマス", "G": "7番のマス"}, "answer": ["C", "G"], "group": "m012"},

{"id": "m035", "subject": "math", "type": "multi", "cat": "推論（順序）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）あてはまるものをすべて選びなさい。", "passage": "P、Q、R、S、Tの5人が待ち合わせをした。この待ち合わせについて、つぎのことがわかっている。<br>Ⅰ）同時に来た人はいなかった<br>Ⅱ）Pはちょうど待ち合わせ時刻に来た<br>Ⅲ）2人が待ち合わせ時刻に遅れて来た<br>Ⅳ）QはRよりも早く、Sよりも遅く来た", "stem": "Tが来た順番として考えられるのはどこか。", "options": {"A": "1番目（最も早い）", "B": "2番目", "C": "3番目", "D": "4番目", "E": "5番目（最も遅い）"}, "answer": ["A", "B", "E"], "group": "m035"},

{"id": "m037", "subject": "math", "type": "single", "cat": "推論（正誤）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）", "passage": "2階建てのアパートがあり、いずれの階も3部屋が一列に並んでいる。このアパートにはP、Q、R、S、Tの5人が別々の部屋に住んでいて、残りの1部屋は空いている。5人が住んでいる部屋について、つぎのことがわかっている。<br>Ⅰ）Pの真上の部屋にはQが住んでいる<br>Ⅱ）RとSは隣り合わせの部屋に住んでいる<br>Ⅲ）Tは角部屋に住んでいる", "stem": "つぎの推論ア、イについて、必ず正しいか、必ず誤りか、あるいはどちらともいえないかを考え、AからIまでの中から正しいものを1つ選びなさい。<br>ア　Pは角部屋に住んでいる<br>イ　Sは角部屋に住んでいる", "options": {"A": "アもイも正しい", "B": "アは正しいが、イはどちらともいえない", "C": "アは正しいが、イは誤り", "D": "アはどちらともいえないが、イは正しい", "E": "アもイもどちらともいえない", "F": "アはどちらともいえないが、イは誤り", "G": "アは誤りだが、イは正しい", "H": "アは誤りだが、イはどちらともいえない", "I": "アもイも誤り"}, "answer": "B", "group": "m037"},

{"id": "m041", "subject": "math", "type": "single", "cat": "速さ", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）", "passage": "甲は車でP地点を出発し、Q地点を経由してR地点に向かい、乙も車でS地点を出発し、R地点を経由してQ地点に向かった。そのときの両者の出発時刻および途中経過時刻は、下表のとおりである。<table><tr><th></th><th>甲</th><th>乙</th></tr><tr><td>P地点</td><td>8：30</td><td>↑</td></tr><tr><td>Q地点</td><td>9：10</td><td>　</td></tr><tr><td>R地点</td><td>　</td><td>9：20</td></tr><tr><td>S地点</td><td>↓</td><td>8：45</td></tr></table>（甲はP地点からS地点の向きに、乙はS地点からP地点の向きに進む）", "stem": "SR間の距離が25kmだとすると、乙のSR間での平均時速はいくらか（必要なときは、最後に小数点以下第1位を四捨五入すること）。", "options": {"A": "30km/時", "B": "33km/時", "C": "38km/時", "D": "43km/時", "E": "47km/時", "F": "50km/時", "G": "53km/時", "H": "57km/時", "I": "60km/時", "J": "AからIのいずれでもない"}, "answer": "D", "group": "m041"},
{"id": "m042", "subject": "math", "type": "single", "cat": "速さ", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の2問目）", "passage": "甲は車でP地点を出発し、Q地点を経由してR地点に向かい、乙も車でS地点を出発し、R地点を経由してQ地点に向かった。そのときの両者の出発時刻および途中経過時刻は、下表のとおりである。<table><tr><th></th><th>甲</th><th>乙</th></tr><tr><td>P地点</td><td>8：30</td><td>↑</td></tr><tr><td>Q地点</td><td>9：10</td><td>　</td></tr><tr><td>R地点</td><td>　</td><td>9：20</td></tr><tr><td>S地点</td><td>↓</td><td>8：45</td></tr></table>（甲はP地点からS地点の向きに、乙はS地点からP地点の向きに進む）", "stem": "QR間では乙は甲の1.5倍の速度で走った。両者が9時30分にすれちがったとすると、QR間での甲の時速はいくらか（必要なときは、最後に小数点以下第1位を四捨五入すること）。ただし、QR間の距離は20kmであり、速度は一定と考える。", "options": {"A": "24km/時", "B": "28km/時", "C": "34km/時", "D": "36km/時", "E": "43km/時", "F": "47km/時", "G": "51km/時", "H": "54km/時", "I": "60km/時", "J": "AからIのいずれでもない"}, "answer": "C", "group": "m041"},
{"id": "m043", "subject": "math", "type": "single", "cat": "推論（順序）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）", "passage": "あるくじをP、Q、R、S、Tの5人が1本ずつ引いたところ、2人が「あたり」で残りの人は「はずれ」だった。5人がくじを引いた順番と、「あたり」を引いた人について、つぎのことがわかっている。<br>Ⅰ）「はずれ」は連続して出なかった<br>Ⅱ）「あたり」を最初に引いたのはPだった<br>Ⅲ）Qよりも後に引いたTは「はずれ」だった", "stem": "つぎの推論ア、イ、ウのうち、<u>必ずしも誤りとはいえないもの</u>はどれか。AからHまでの中から1つ選びなさい。<br>ア　Rは2番目に引いた<br>イ　Sは「はずれ」を引いた<br>ウ　Tは4番目に引いた", "options": {"A": "アだけ", "B": "イだけ", "C": "ウだけ", "D": "アとイの両方", "E": "アとウの両方", "F": "イとウの両方", "G": "アとイとウのすべて", "H": "ア、イ、ウのいずれも誤り"}, "answer": "B", "group": "m043"},

{"id": "m112", "subject": "math", "type": "multi", "cat": "推論（組み合わせ）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）あてはまるものをすべて選びなさい。", "passage": "赤のボールペンが4本、黒と青のボールペンが3本ずつあり、P、Q、R、S、Tの5人で2本ずつ分けた。この5人がもらったボールペンの色について、つぎのことがわかっている。<br>Ⅰ）PとQがもらったボールペンの色の組み合わせは同じだった<br>Ⅱ）Rは赤のボールペンをもらわなかった", "stem": "仮に、Sは赤のボールペンを2本もらったとする。このとき、Tがもらったボールペンの色の組み合わせとして考えられるのはどれか。", "options": {"A": "赤2本", "B": "黒2本", "C": "青2本", "D": "赤と黒1本ずつ", "E": "赤と青1本ずつ", "F": "黒と青1本ずつ"}, "answer": ["A", "B", "C", "F"], "group": "m112"},

{"id": "m116", "subject": "math", "type": "single", "cat": "推論（組み合わせ）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）", "passage": "P、Q、R、S、Tの5人は、ある地域で行われた運動会の綱引き、玉入れ、大縄跳びのうち少なくとも1種目に参加した。5人が参加した種目について、つぎのことがわかっている。<br>Ⅰ）綱引きには3人、玉入れには4人、大縄跳びには2人が参加した<br>Ⅱ）2種目に参加したのは2人だった<br>Ⅲ）Qが参加したのは大縄跳びだけだった<br>Ⅳ）Rは綱引きには参加しなかった", "stem": "Ⅰ）からⅣ）までの情報から判断して、つぎの推論ア、イ、ウのうち、<u>必ずしも誤りとはいえないもの</u>はどれか。AからHまでの中から1つ選びなさい。<br>ア　Pは2種目に参加した<br>イ　Rは2種目に参加した<br>ウ　Tは2種目に参加した", "options": {"A": "アだけ", "B": "イだけ", "C": "ウだけ", "D": "アとイの両方", "E": "アとウの両方", "F": "イとウの両方", "G": "アとイとウのすべて", "H": "ア、イ、ウのいずれも誤り"}, "answer": "E", "group": "m116"},

{"id": "m118", "subject": "math", "type": "single", "cat": "推論（数量）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）", "passage": "V、W、X、Y、Zの5社に工事の見積を依頼したところ、最高額の1100万円を提示したのはX社だけで、最も安かった会社の見積金額との差は300万円だった。各社の見積金額についてつぎのことがわかっている。<br>Ⅰ）V社とW社との差は200万円だった<br>Ⅱ）W社とZ社との差は100万円だった<br>Ⅲ）Y社とZ社との差は100万円だった", "stem": "Ⅰ）からⅢ）までの情報から判断して、つぎの推論ア、イについて、必ず正しいか、必ず誤りか、あるいはどちらともいえないかを考え、AからIまでの中から正しいものを1つ選びなさい。<br>ア　W社の見積金額は800万円だった<br>イ　Z社の見積金額は900万円だった", "options": {"A": "アもイも正しい", "B": "アは正しいが、イはどちらともいえない", "C": "アは正しいが、イは誤り", "D": "アはどちらともいえないが、イは正しい", "E": "アもイもどちらともいえない", "F": "アはどちらともいえないが、イは誤り", "G": "アは誤りだが、イは正しい", "H": "アは誤りだが、イはどちらともいえない", "I": "アもイも誤り"}, "answer": "D", "group": "m118"},

{"id": "m134", "subject": "math", "type": "single", "cat": "推論（対戦）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の1問目）", "passage": "P、Qの2人がゲームをした。それぞれが（1）（2）（3）（4）（5）の5枚のカードを持ち、同時に1枚ずつ出して数字の大きいほうを勝ちとし、同じ数字なら引き分けとする対戦を、カードがなくなるまで5回行った。2人の対戦について、つぎのことがわかっている。<br>Ⅰ）Pは4勝1敗だった<br>Ⅱ）Pは1回目に（5）を出した<br>Ⅲ）Qは4回目に（1）を出した<br>Ⅳ）3回目の対戦はQが勝った", "stem": "Ⅰ）からⅣ）までの情報から判断して、つぎの推論ア、イについて、必ず正しいか、必ず誤りか、あるいはどちらともいえないかを考え、AからIまでの中から正しいものを1つ選びなさい。<br>ア　Pは3回目に（3）を出した<br>イ　Qは3回目に（5）を出した", "options": {"A": "アもイも正しい", "B": "アは正しいが、イはどちらともいえない", "C": "アは正しいが、イは誤り", "D": "アはどちらともいえないが、イは正しい", "E": "アもイもどちらともいえない", "F": "アはどちらともいえないが、イは誤り", "G": "アは誤りだが、イは正しい", "H": "アは誤りだが、イはどちらともいえない", "I": "アもイも誤り"}, "answer": "G", "group": "m134"},

{"id": "m136", "subject": "math", "type": "single", "cat": "集合", "instruction": "つぎの説明を読んで、各問いに答えなさい。（3問組の1問目）", "passage": "ある小学校の6年生56人に、塾・通信添削・家庭教師を利用しているかどうかアンケートをとったところ、つぎのとおりであった。<br>塾を利用している　　　　33人<br>通信添削を利用している　14人<br>家庭教師を利用している　12人", "stem": "塾は利用しているが通信添削は利用していない児童は28人だった。通信添削は利用しているが塾は利用していない児童は何人か。", "options": {"A": "3人", "B": "4人", "C": "5人", "D": "6人", "E": "7人", "F": "8人", "G": "9人", "H": "10人", "I": "11人", "J": "AからIのいずれでもない"}, "answer": "G", "group": "m136"},

{"id": "m144", "subject": "math", "type": "single", "cat": "推論（組み合わせ）", "instruction": "つぎの説明を読んで、各問いに答えなさい。（2問組の2問目）", "passage": "P、Q、R、S、Tは夏休みにそれぞれ別の地域に旅行した。5人のうち男性は3人、女性は2人で、行先は北海道、沖縄、アメリカ、イギリス、フランスだった。5人の性別と行先について、つぎのことがわかっている。<br>Ⅰ）男性のうち2人が海外旅行だった<br>Ⅱ）ヨーロッパには男性と女性のそれぞれ1人が行った<br>Ⅲ）QとSは国内旅行だった<br>Ⅳ）Rはアメリカに行った", "stem": "Ⅰ）からⅣ）までの情報のほかに、PはSと同性で、北海道には女性が行ったことがわかった。このとき、つぎの推論カ、キについて、必ず正しいか、必ず誤りか、あるいはどちらともいえないかを考え、AからIまでの中から正しいものを1つ選びなさい。<br>カ　PがRと同性なら、Sは沖縄に行った<br>キ　Qが沖縄に行ったなら、Tは女性である", "options": {"A": "カもキも正しい", "B": "カは正しいが、キはどちらともいえない", "C": "カは正しいが、キは誤り", "D": "カはどちらともいえないが、キは正しい", "E": "カもキもどちらともいえない", "F": "カはどちらともいえないが、キは誤り", "G": "カは誤りだが、キは正しい", "H": "カは誤りだが、キはどちらともいえない", "I": "カもキも誤り"}, "answer": "C", "group": "m143"},

/* =========================================================
   保存（localStorage が使えない環境ではメモリに退避）
   ========================================================= */
const KEY = "spi-drill-v2";
const blank = () => ({wrong:[], seen:0, correct:0});
let memoryStore = null;
let storageOK = true;

function loadState(){
  if(memoryStore) return memoryStore;
  try{
    const raw = localStorage.getItem(KEY);
    const s = raw ? JSON.parse(raw) : {};
    return {lang:{...blank(), ...(s.lang||{})}, math:{...blank(), ...(s.math||{})}};
  }catch(e){
    storageOK = false;
    memoryStore = {lang:blank(), math:blank()};
    return memoryStore;
  }
}
function saveState(s){
  if(memoryStore){ memoryStore = s; return; }
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }
  catch(e){ storageOK = false; memoryStore = s; }
}

let state = loadState();

/* =========================================================
   画面制御
   ========================================================= */
const $ = id => document.getElementById(id);
const LABEL = {lang:"言語", math:"非言語"};
let subject = "lang";
let queue = [], cursor = 0, current = null, picked = [], answered = false, mode = "random";

const bank = s => QUESTIONS.filter(q => q.subject === s);

function refreshHome(){
  $("tab-lang").setAttribute("aria-selected", subject === "lang");
  $("tab-math").setAttribute("aria-selected", subject === "math");

  const pool = bank(subject);
  const st = state[subject];
  $("bank-size").textContent =
    "言語 " + bank("lang").length + "問 ／ 非言語 " + bank("math").length + "問";
  $("random-desc").textContent = LABEL[subject] + "の" + pool.length + "問からシャッフルして出題します。";
  $("st-total").textContent = st.seen;
  $("st-acc").textContent = st.seen ? Math.round(st.correct / st.seen * 100) + "%" : "—";
  $("st-weak").textContent = st.wrong.length;

  const has = st.wrong.length > 0;
  $("btn-review").disabled = !has;
  $("review-desc").textContent = has
    ? LABEL[subject] + "の復習リスト " + st.wrong.length + "問を出題します。正解すればリストから消えます。"
    : "まだ間違えた問題はありません。ランダム出題から始めてください。";

  $("storage-note").textContent = storageOK
    ? "記録はこの端末のブラウザの localStorage にキー「" + KEY + "」として保存されます。言語と非言語は別々に集計されます。外部には送信されません。"
    : "このブラウザでは保存が使えないため、記録はページを閉じるまでの一時的なものになります。ファイルをダウンロードして開くと保存されます。";
}

function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}
  return r;
}

function start(m){
  mode = m;
  const st = state[subject];
  const pool = m === "random" ? bank(subject) : bank(subject).filter(q => st.wrong.includes(q.id));
  if(!pool.length){ refreshHome(); return; }
  const lim = parseInt($("q-num").value, 10);

  if(subject === "math"){
    // 同じ資料を使う組問題は、組ごとにまとめて順番どおりに出す
    const order = [], byGroup = new Map();
    pool.forEach(q => {
      const g = q.group || q.id;
      if(!byGroup.has(g)){ byGroup.set(g, []); order.push(g); }
      byGroup.get(g).push(q);
    });
    queue = [];
    for(const g of shuffle(order)){
      queue = queue.concat(byGroup.get(g));
      if(lim > 0 && queue.length >= lim) break;
    }
  }else{
    queue = shuffle(pool);
    if(lim > 0) queue = queue.slice(0, lim);
  }
  cursor = 0;
  $("home").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
}

function render(){
  current = queue[cursor];
  picked = [];
  answered = false;

  $("q-mode").textContent =
    LABEL[current.subject] + "　" + (mode === "random" ? "ランダム出題" : "復習") + "　" + current.cat;
  $("q-count").textContent = (cursor+1) + " / " + queue.length;
  $("q-instruction").textContent = current.instruction;

  const pass = $("q-passage");
  if(current.passage){
    pass.innerHTML = current.passage + (current.source ? '<span class="source">'+current.source+'</span>' : "");
    pass.classList.remove("hidden");
  }else{
    pass.classList.add("hidden");
  }

  $("q-stem").innerHTML = current.stem + (current.flag ? '<span class="flag">'+current.flag+'</span>' : "");

  const list = $("q-options");
  list.innerHTML = "";
  const tw = $("q-textwrap");

  if(current.type === "text"){
    list.classList.add("hidden");
    tw.classList.remove("hidden");
    $("q-text").value = "";
    $("q-text").disabled = false;
  }else{
    list.classList.remove("hidden");
    tw.classList.add("hidden");
    Object.keys(current.options).forEach(k => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.className = "opt" + (current.type === "multi" ? " multi" : "");
      b.dataset.key = k;
      b.innerHTML = '<span class="k">'+k+'</span><span class="t">'+current.options[k]+'</span>';
      b.addEventListener("click", () => pick(k, b));
      li.appendChild(b);
      list.appendChild(li);
    });
  }

  $("q-verdict").classList.add("hidden");
  $("btn-check").classList.remove("hidden");
  $("btn-check").disabled = false;
  $("btn-next").classList.add("hidden");
  $("btn-next").textContent = (cursor === queue.length - 1) ? "結果を見る" : "次の問題";
  window.scrollTo({top:0});
}

function pick(k, el){
  if(answered) return;
  if(current.type === "multi"){
    const i = picked.indexOf(k);
    if(i >= 0){ picked.splice(i,1); el.classList.remove("picked"); }
    else{ picked.push(k); el.classList.add("picked"); }
  }else{
    picked = [k];
    document.querySelectorAll("#q-options .opt").forEach(o => o.classList.remove("picked"));
    el.classList.add("picked");
  }
}

const normalize = s => String(s).replace(/[\s　]/g,"").trim();

function check(){
  if(answered) return;
  const ansArr = Array.isArray(current.answer) ? current.answer : [current.answer];
  let ok = false, userLabel = "";

  if(current.type === "text"){
    const v = $("q-text").value;
    userLabel = v || "（未入力）";
    ok = ansArr.some(a => normalize(a) === normalize(v));
    $("q-text").disabled = true;
  }else{
    if(!picked.length) return;
    userLabel = picked.slice().sort().join("・");
    ok = picked.length === ansArr.length && ansArr.every(a => picked.includes(a));
    document.querySelectorAll("#q-options .opt").forEach(o => {
      const k = o.dataset.key;
      o.disabled = true;
      o.classList.remove("picked");
      if(ansArr.includes(k)) o.classList.add("is-correct");
      else if(picked.includes(k)) o.classList.add("is-wrong");
    });
  }

  answered = true;
  const st = state[current.subject];
  st.seen++;
  if(ok){
    st.correct++;
    st.wrong = st.wrong.filter(id => id !== current.id);
  }else if(!st.wrong.includes(current.id)){
    st.wrong.push(current.id);
  }
  saveState(state);

  const v = $("q-verdict");
  v.className = "verdict " + (ok ? "ok" : "ng");
  const correctLabel = current.type === "text"
    ? ansArr.join(" / ")
    : ansArr.map(k => k + "　" + current.options[k].replace(/<\/?u>/g,"")).join("　／　");
  v.innerHTML =
    "<h3>" + (ok ? "正解" : "不正解") + "</h3>" +
    "<p>あなたの解答：" + userLabel + "<br>正解：" + correctLabel + "</p>" +
    (current.memo ? '<div class="memo">' + current.memo + "</div>" : "") +
    (ok ? "" : '<div class="memo">この問題を復習リストに追加しました。</div>');
  v.classList.remove("hidden");

  $("btn-check").classList.add("hidden");
  $("btn-next").classList.remove("hidden");
  $("btn-next").focus();
}

function next(){
  if(cursor < queue.length - 1){ cursor++; render(); }
  else{ goHome(); }
}

function goHome(){
  $("quiz").classList.add("hidden");
  $("home").classList.remove("hidden");
  refreshHome();
  window.scrollTo({top:0});
}

$("tab-lang").addEventListener("click", () => { subject = "lang"; refreshHome(); });
$("tab-math").addEventListener("click", () => { subject = "math"; refreshHome(); });
$("btn-random").addEventListener("click", () => start("random"));
$("btn-review").addEventListener("click", () => start("review"));
$("btn-check").addEventListener("click", check);
$("btn-next").addEventListener("click", next);
$("btn-home").addEventListener("click", goHome);
$("btn-purge").addEventListener("click", () => {
  if(!confirm("保存データ（言語・非言語の解答記録と復習リスト）を完全に削除します。\nブラウザに保存されたキー「" + KEY + "」ごと消去します。よろしいですか。")) return;
  let removed = true;
  try{ localStorage.removeItem(KEY); }
  catch(e){ removed = false; }
  if(memoryStore) memoryStore = {lang:blank(), math:blank()};
  state = {lang:blank(), math:blank()};
  refreshHome();
  $("storage-note").textContent = removed
    ? "保存データを削除しました。キー「" + KEY + "」はブラウザから消えています。"
    : "このブラウザでは保存領域を操作できませんでした。記録はメモリ上でのみ初期化しました。";
});
$("q-text").addEventListener("keydown", e => { if(e.key === "Enter") check(); });

refreshHome();
</script>
</div>
</body>
